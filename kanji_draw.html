<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escritura de Kanji</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:#f5f0eb;min-height:100vh;padding:1.5rem 1rem;display:flex;flex-direction:column;align-items:center;}
h1{font-size:1rem;font-weight:500;color:#555;margin-bottom:.25rem;letter-spacing:.05em;text-align:center}
.subtitle{font-size:.8rem;color:#a08070;margin-bottom:1.25rem;text-align:center;font-style:italic}

/* font preloader */
#fontPreload{position:absolute;opacity:0;pointer-events:none;font-family:'Noto Sans JP',serif;font-size:180px;color:transparent;top:-999px}

/* filter bar */
.filter-bar{display:flex;gap:6px;margin-bottom:.75rem;background:#fff;border:1px solid #e0d8d0;border-radius:99px;padding:4px}
.fbtn{font-size:12px;padding:5px 14px;border-radius:99px;border:none;background:transparent;color:#888;cursor:pointer;transition:all .2s;font-family:inherit;font-weight:500}
.fbtn.active{background:#c0392b;color:#fff}

/* toggle bar */
.toggle-bar{display:flex;gap:6px;margin-bottom:1.25rem;background:#fff;border:1px solid #e0d8d0;border-radius:99px;padding:4px}
.tbtn{font-size:12px;padding:5px 16px;border-radius:99px;border:none;background:transparent;color:#888;cursor:pointer;transition:all .2s;font-family:inherit;font-weight:500}
.tbtn.active{background:#3b72d4;color:#fff}

/* progress */
.prog-wrap{width:100%;max-width:560px}
.prog-bar-wrap{height:3px;background:#ddd;border-radius:2px;margin-bottom:.4rem;overflow:hidden}
.prog-bar-fill{height:100%;background:#3b72d4;border-radius:2px;transition:width .3s}
.prog-text{font-size:11px;color:#aaa;text-align:center;margin-bottom:1rem}

/* card */
.card{background:#fff;border:1px solid #e0d8d0;border-radius:20px;padding:1.5rem 1.25rem;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:.9rem;}

/* readings block */
.readings-block{width:100%;max-width:280px;display:flex;flex-direction:column;gap:4px}
.reading-row{display:flex;gap:8px;align-items:baseline;font-size:.9rem}
.reading-label{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#aaa;min-width:32px}
.reading-kana{color:#1a1209;letter-spacing:.05em}
.reading-kana.on{color:#2255aa}
.reading-kana.kun{color:#2d7a3e}
.reading-divider{width:100%;max-width:280px;height:1px;background:#e8e0d8}
.meaning-text{font-size:.82rem;color:#c0392b;font-weight:500;text-align:center;line-height:1.6;max-width:280px}

/* canvas wrap */
.canvas-wrap{
  position:relative;width:220px;height:220px;
  border-radius:12px;border:2px solid #d8d0c8;
  overflow:hidden;background:#fafaf7;
  touch-action:none;cursor:crosshair;
}
.canvas-wrap.locked{cursor:default}
.canvas-wrap::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(#ccc 1px,transparent 1px),
    linear-gradient(90deg,#ccc 1px,transparent 1px),
    linear-gradient(#e8e4e0 1px,transparent 1px),
    linear-gradient(90deg,#e8e4e0 1px,transparent 1px);
  background-size:110px 110px,110px 110px,22px 22px,22px 22px;
  pointer-events:none;z-index:1;
}
.canvas-wrap::after{content:none;}
.guide-canvas{position:absolute;inset:0;z-index:2;pointer-events:none;transition:opacity .4s}
.draw-canvas{position:absolute;inset:0;z-index:3;}

/* drawing area responsive */
.drawing-area{display:flex;flex-direction:row;gap:1.25rem;justify-content:center;align-items:flex-start;flex-wrap:nowrap;width:100%}
@media(max-width:520px){.drawing-area{flex-direction:column;align-items:center;}}
/* combined always stacks vertically */
.drawing-area.combined{flex-direction:column;align-items:center;}

.canvas-section{display:flex;flex-direction:column;align-items:center;gap:.4rem}
.canvas-label{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#aaa}
.canvas-label.blue{color:#3b72d4}

/* ref wrap */
.ref-wrap{
  position:relative;width:220px;height:220px;
  border-radius:12px;border:2px solid #3b72d4;
  overflow:hidden;background:#eef3fd;
}
.ref-wrap::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(#c8d8f0 1px,transparent 1px),
    linear-gradient(90deg,#c8d8f0 1px,transparent 1px),
    linear-gradient(#dce8f8 1px,transparent 1px),
    linear-gradient(90deg,#dce8f8 1px,transparent 1px);
  background-size:110px 110px,110px 110px,22px 22px,22px 22px;
  pointer-events:none;z-index:1;
}
.ref-wrap::after{content:none;}
.ref-canvas{position:absolute;inset:0;z-index:2;}

/* stroke hint */
.stroke-hint{font-size:.7rem;color:#bbb;text-align:center}

/* combined tag */
.combined-tag{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 10px;border-radius:99px;background:#fdecea;color:#c0392b}

/* buttons */
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cbtn{font-size:13px;padding:8px 18px;border-radius:10px;border:1px solid #d8d0c8;background:#f7f4f0;color:#555;cursor:pointer;font-family:inherit;transition:all .15s;font-weight:500}
.cbtn:hover{background:#ece8e0;border-color:#bbb}
.cbtn.check{background:#3b72d4;color:#fff;border-color:transparent}
.cbtn.check:hover{background:#2f5eab}
.cbtn.clear{background:#fdecea;color:#b03030;border-color:transparent}
.cbtn.clear:hover{background:#f9d6d4}


/* combined canvas — wider rectangle, 70% height */
.canvas-wrap.combined{
  width:320px;height:154px;
}
.canvas-wrap.combined::before{
  background-size:320px 154px,320px 154px,20px 20px,20px 20px;
}
/* strong center divider for combined */
.combined-divider{
  position:absolute;left:50%;top:0;width:2px;height:100%;
  background:#bbb;pointer-events:none;z-index:4;
  transform:translateX(-50%);
}
.ref-wrap.combined{
  width:320px;height:154px;
}
.ref-wrap.combined::before{
  background-size:320px 154px,320px 154px,20px 20px,20px 20px;
}

/* nav */
.nav-controls{display:flex;gap:8px;justify-content:center;margin-top:.25rem;max-width:560px;width:100%}
.nav-btn{font-size:13px;padding:9px 20px;border-radius:10px;border:1px solid #ddd;background:#f7f4f0;color:#333;cursor:pointer;transition:all .15s;font-weight:500;font-family:inherit}
.nav-btn:hover:not(:disabled){background:#ece8e0}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn.primary{background:#3b72d4;color:#fff;border-color:transparent}
.nav-btn.primary:hover:not(:disabled){background:#2f5eab}

/* done */
.done-msg{background:#fff;border:1px solid #e0d8d0;border-radius:20px;padding:2.5rem 1.5rem;text-align:center;max-width:560px;width:100%}
.done-msg h2{font-size:1.3rem;font-weight:500;margin-bottom:.5rem}
.done-msg p{font-size:.9rem;color:#888;margin-bottom:1.5rem}
.done-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* torii */
.torii-home{position:fixed;top:14px;left:14px;z-index:999;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.85;transition:opacity .2s,transform .2s}
.torii-home:hover{opacity:1;transform:scale(1.08)}
.torii-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c0392b;font-family:sans-serif;font-weight:600}
</style>
</head>
<body>

<a class="torii-home" href="./" title="Inicio">
  <svg width="44" height="38" viewBox="0 0 44 38" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="multiply" result="blend"/><feComposite in="blend" in2="SourceGraphic" operator="in"/></filter></defs>
    <ellipse cx="22" cy="37" rx="14" ry="2.5" fill="rgba(0,0,0,.13)"/>
    <rect x="6" y="14" width="5" height="22" rx="1.5" fill="#c0392b" filter="url(#grain)"/>
    <rect x="33" y="14" width="5" height="22" rx="1.5" fill="#c0392b" filter="url(#grain)"/>
    <rect x="4" y="19" width="36" height="3.5" rx="1.5" fill="#a93226" filter="url(#grain)"/>
    <path d="M1,8 Q3,4 22,5.5 Q41,4 43,8 L40,11 Q22,9.5 4,11 Z" fill="#c0392b" filter="url(#grain)"/>
    <rect x="5" y="11" width="34" height="3" rx="1" fill="#b03020" filter="url(#grain)"/>
    <path d="M4,8.5 Q22,7 40,8.5" stroke="rgba(255,255,255,.18)" stroke-width="1" fill="none"/>
    <rect x="16" y="11.5" width="12" height="2" rx=".5" fill="#7a1f18" opacity=".7"/>
  </svg>
  <span class="torii-label">inicio</span>
</a>

<div id="fontPreload">人日本何大学生先名前会社一二三四五六七八九十</div>

<h1>漢字 — Escritura</h1>
<p class="subtitle">Traza el kanji con mouse, dedo o lápiz electrónico</p>

<div class="filter-bar">
  <button class="fbtn active" id="fAll"        onclick="setFilter('all')">Todo</button>
  <button class="fbtn"        id="fSingle"     onclick="setFilter('single')">Individuales</button>
  <button class="fbtn"        id="fCombined"   onclick="setFilter('combined')">Combinados</button>
    <button class="fbtn"        id="fNumber"     onclick="setFilter('number')">Números</button>
</div>

<div class="toggle-bar">
  <button class="tbtn active" id="btnBlind"  onclick="setMode('blind')">Sin transparencia</button>
  <button class="tbtn"        id="btnGuide"  onclick="setMode('guide')">Con transparencia</button>
</div>

<div class="prog-wrap">
  <div class="prog-bar-wrap"><div class="prog-bar-fill" id="progBar" style="width:0%"></div></div>
  <div class="prog-text" id="progText"></div>
</div>

<div class="card" id="mainCard">
  <div id="combinedTag"></div>
  <div class="readings-block" id="readingsBlock"></div>
  <div class="reading-divider"></div>
  <div class="meaning-text" id="meaningText"></div>
  <div class="drawing-area" id="drawingArea"></div>
  <div class="stroke-hint" id="strokeHint"></div>
  <div class="btn-row" id="btnRow"></div>
</div>

<div class="nav-controls">
  <button class="nav-btn" id="btnPrev" onclick="goTo(idx-1)" disabled>← Anterior</button>
  <button class="nav-btn primary" id="btnNext" onclick="goTo(idx+1)">Siguiente →</button>
</div>

<div class="done-msg" id="doneMsg" style="display:none">
  <h2>¡Práctica completa! 🌸</h2>
  <p>Has practicado todos los kanjis de esta selección.</p>
  <div class="done-btns">
    <button class="nav-btn" onclick="init()">Repetir todo</button>
    <button class="nav-btn" onclick="reviewAll()">← Repasar mis respuestas</button>
  </div>
</div>

<script>
// ── KANJI DATA ────────────────────────────────────────────────────
// type: 'single' or 'combined'
// on: onyomi in katakana (array)
// kun: kunyomi in hiragana (array)
// reading: for combined — the actual reading in katakana
// meanings: array of Spanish meanings
// strokes: stroke count string
const ALL_KANJIS = [
  // ── INDIVIDUALES ─────────────────────────────────────────────
  {
    type:'single', char:'人',
    on:['ジン','ニン'], kun:['ひと'],
    meanings:['persona','gente','ser humano','otro','cierta persona'],
    strokes:'2 trazos',
  },
  {
    type:'single', char:'日',
    on:['ニチ','カ'], kun:['ひ','か'],
    meanings:['sol','día','fecha','luz del día','Japón'],
    strokes:'4 trazos',
  },
  {
    type:'single', char:'本',
    on:['ホン'], kun:['もと'],
    meanings:['origen','base','raíz','libro','principal','este (Japón)'],
    strokes:'5 trazos',
  },
  {
    type:'single', char:'何',
    on:['カ'], kun:['なに','なん'],
    meanings:['¿qué?','¿cuánto?','¿cuál?','algo','cierto número de'],
    strokes:'7 trazos',
  },
  {
    type:'single', char:'大',
    on:['ダイ','タイ'], kun:['おお(きい)'],
    meanings:['grande','grandioso','mucho','mayor','importante'],
    strokes:'3 trazos',
  },
  {
    type:'single', char:'学',
    on:['ガク'], kun:['まな(ぶ)'],
    meanings:['estudiar','aprender','ciencia','conocimiento','disciplina académica'],
    strokes:'8 trazos',
  },
  {
    type:'single', char:'生',
    on:['セイ','ショウ'], kun:['い(きます)','うま(れます)'],
    meanings:['vivir','nacer','vida','crudo','estudiante','persona'],
    strokes:'5 trazos',
  },
  {
    type:'single', char:'先',
    on:['セン'], kun:['さき','ま(ず)'],
    meanings:['antes','adelantado','previo','futuro','punta','primero que nada'],
    strokes:'6 trazos',
  },
  {
    type:'single', char:'名',
    on:['ナイ','ミョウ'], kun:['な'],
    meanings:['nombre','reputación','distinguido','famoso','contador de personas'],
    strokes:'6 trazos',
  },
  {
    type:'single', char:'前',
    on:['ゼン'], kun:['まえ'],
    meanings:['antes','delante','previo','frente','adelantado','anterior'],
    strokes:'9 trazos',
  },
  {
    type:'single', char:'会',
    on:['カイ','エ'], kun:['あ(います)','あ(わせます)','あつ(まります)'],
    meanings:['conocer','encontrarse','reunirse','hacer un compromiso','coleccionar','asociación'],
    strokes:'6 trazos',
  },
  {
    type:'single', char:'社',
    on:['シャ'], kun:['やしろ'],
    meanings:['compañía','empresa','asociación','sociedad','templo sintoísta'],
    strokes:'7 trazos',
  },
  // ── COMBINADOS ───────────────────────────────────────────────
  {
    type:'combined', char:'大学',
    reading:'ダイガク',
    meanings:['universidad','institución de educación superior'],
    strokes:'3 + 8 trazos',
  },
  {
    type:'combined', char:'学生',
    reading:'ガクセイ',
    meanings:['estudiante','alumno'],
    strokes:'8 + 5 trazos',
  },
  {
    type:'combined', char:'人生',
    reading:'ジンセイ',
    meanings:['vida propia','trayectoria de vida','existencia humana'],
    strokes:'2 + 5 trazos',
  },
  {
    type:'combined', char:'先生',
    reading:'センセイ',
    meanings:['profesor','maestro','doctor','sensei'],
    strokes:'6 + 5 trazos',
  },
  {
    type:'combined', char:'名前',
    reading:'なまえ',
    readingNote:'kun+kun',
    meanings:['nombre','nombre propio','nombre completo'],
    strokes:'6 + 9 trazos',
  },

  // ── NÚMEROS ──────────────────────────────────────────────────
  {
    type:'number', char:'一',
    on:['イチ','イツ'], kun:['ひと(つ)'],
    meanings:['uno','primero','único','un poco'],
    strokes:'1 trazo',
  },
  {
    type:'number', char:'二',
    on:['ニ'], kun:['ふた(つ)'],
    meanings:['dos','segundo','doble'],
    strokes:'2 trazos',
  },
  {
    type:'number', char:'三',
    on:['サン'], kun:['みっ(つ)','み'],
    meanings:['tres','tercero'],
    strokes:'3 trazos',
  },
  {
    type:'number', char:'四',
    on:['シ'], kun:['よっ(つ)','よん','よ'],
    meanings:['cuatro','cuarto'],
    strokes:'5 trazos',
  },
  {
    type:'number', char:'五',
    on:['ゴ'], kun:['いつ(つ)'],
    meanings:['cinco','quinto'],
    strokes:'4 trazos',
  },
  {
    type:'number', char:'六',
    on:['ロク','リク'], kun:['むっ(つ)','む'],
    meanings:['seis','sexto'],
    strokes:'4 trazos',
  },
  {
    type:'number', char:'七',
    on:['シチ'], kun:['なな(つ)','なの'],
    meanings:['siete','séptimo'],
    strokes:'2 trazos',
  },
  {
    type:'number', char:'八',
    on:['ハチ'], kun:['やっ(つ)','や'],
    meanings:['ocho','octavo'],
    strokes:'2 trazos',
  },
  {
    type:'number', char:'九',
    on:['ク','キュウ'], kun:['ここの(つ)'],
    meanings:['nueve','noveno'],
    strokes:'2 trazos',
  },
  {
    type:'number', char:'十',
    on:['ジュウ','ジッ'], kun:['とお','と'],
    meanings:['diez','décimo','diez unidades'],
    strokes:'2 trazos',
  },
];

// ── STATE ─────────────────────────────────────────────────────────
let deck=[], idx=0, guideMode=false, filterMode='all', compared=false;

function getFilteredDeck(){
  if(filterMode==='all') return [...ALL_KANJIS];
  return ALL_KANJIS.filter(k=>k.type===filterMode);
}

function setFilter(mode){
  filterMode=mode;
  document.getElementById('fAll').classList.toggle('active', mode==='all');
  document.getElementById('fSingle').classList.toggle('active', mode==='single');
  document.getElementById('fCombined').classList.toggle('active', mode==='combined');
  document.getElementById('fNumber').classList.toggle('active', mode==='number');
  init();
}

function setMode(mode){
  guideMode=(mode==='guide');
  document.getElementById('btnBlind').classList.toggle('active',!guideMode);
  document.getElementById('btnGuide').classList.toggle('active',guideMode);
  renderCard();
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

function init(){
  deck=getFilteredDeck();
  shuffle(deck);
  idx=0; compared=false;
  document.getElementById('doneMsg').style.display='none';
  document.getElementById('mainCard').style.display='flex';
  document.querySelector('.nav-controls').style.display='flex';
  renderCard();
}

// ── RENDER CARD ───────────────────────────────────────────────────
function renderCard(){
  const k=deck[idx]; compared=false;

  // combined tag
  const tagEl=document.getElementById('combinedTag');
  if(k.type==='combined'){
    tagEl.innerHTML='<span class="combined-tag">Combinado</span>';
  } else { tagEl.innerHTML=''; }

  // readings block
  const rb=document.getElementById('readingsBlock');
  if(k.type==='single'||k.type==='number'){
    rb.innerHTML=`
      <div class="reading-row">
        <span class="reading-label">On:</span>
        <span class="reading-kana on">${k.on.join('、')}</span>
      </div>
      <div class="reading-row">
        <span class="reading-label">Kun:</span>
        <span class="reading-kana kun">${k.kun.join('、')}</span>
      </div>
    `;
  } else {
    // combined — show reading + optional note
    const noteHtml=k.readingNote?` <span style="font-size:.7rem;color:#aaa">(${k.readingNote})</span>`:'';
    rb.innerHTML=`
      <div class="reading-row" style="justify-content:center">
        <span class="reading-label">Lectura:</span>
        <span class="reading-kana on">${k.reading}${noteHtml}</span>
      </div>
    `;
  }

  // meaning
  document.getElementById('meaningText').textContent=k.meanings.join(' · ');
  document.getElementById('strokeHint').textContent=k.strokes;

  // progress
  const pct=Math.round((idx/(deck.length-1||1))*100);
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progText').textContent=(idx+1)+' / '+deck.length;

  // drawing area
  const area=document.getElementById('drawingArea');
  const isComb=k.type==='combined'&&k.char.length>1;
  const cW=isComb?320:220, cH=isComb?154:220;
  const combClass=isComb?' combined':'';
  const divider=isComb?'<div class="combined-divider"></div>':'';
  area.innerHTML=`
    <div class="canvas-section">
      <div class="canvas-label">${guideMode?'Con guía':'Tu trazo'}</div>
      <div class="canvas-wrap${combClass}" id="canvasWrap">
        ${divider}
        <canvas class="guide-canvas" id="guideCanvas" width="${cW}" height="${cH}" style="opacity:0"></canvas>
        <canvas class="draw-canvas"  id="drawCanvas"  width="${cW}" height="${cH}"></canvas>
      </div>
    </div>
    <div class="canvas-section" id="refSection" style="display:none">
      <div class="canvas-label blue">Modelo</div>
      <div class="ref-wrap${combClass}">
        <canvas class="ref-canvas" id="refCanvas" width="${cW}" height="${cH}"></canvas>
      </div>
    </div>
  `;

  drawGuide(k.char, guideMode?0.12:0);
  setupDrawing();
  renderBtns();
  // combined: stack model below
  if(isComb) document.getElementById('drawingArea').classList.add('combined');

  // nav
  document.getElementById('btnPrev').disabled=(idx===0);
  const nextBtn=document.getElementById('btnNext');
  const isLast=(idx===deck.length-1);
  nextBtn.textContent=isLast?'Ver resultados →':'Siguiente →';
  nextBtn.disabled=false;
}

// ── DRAW ──────────────────────────────────────────────────────────
function drawGuide(char, opacity){
  const canvas=document.getElementById('guideCanvas');
  canvas.style.opacity=opacity;
  const ctx=canvas.getContext('2d');
  const k=deck[idx];
  const isCombined=k.type==='combined'&&k.char.length>1;
  const W=isCombined?320:220, H=isCombined?154:220;
  canvas.width=W; canvas.height=H;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#1a1209';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  if(isCombined){
    // draw each kanji in its own half
    const chars=[...k.char];
    ctx.font='110px "Noto Sans JP",serif';
    ctx.fillText(chars[0], W/4, H/2 - H*0.06);
    ctx.fillText(chars[1], W*3/4, H/2 - H*0.06);
  } else {
    ctx.font='180px "Noto Sans JP",serif';
    ctx.fillText(char,110,105);
  }
}

function drawRef(char){
  const canvas=document.getElementById('refCanvas');
  const ctx=canvas.getContext('2d');
  const k=deck[idx];
  const isCombined=k.type==='combined'&&char.length>1;
  const W=isCombined?320:220, H=isCombined?154:220;
  canvas.width=W; canvas.height=H;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#1a4a9a';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  if(isCombined){
    const chars=[...char];
    ctx.font='110px "Noto Sans JP",serif';
    ctx.fillText(chars[0], W/4, H/2 - H*0.06);
    ctx.fillText(chars[1], W*3/4, H/2 - H*0.06);
  } else {
    ctx.font='180px "Noto Sans JP",serif';
    ctx.fillText(char,110,105);
  }
}

// ── BUTTONS ───────────────────────────────────────────────────────
function renderBtns(){
  const row=document.getElementById('btnRow');
  if(guideMode){
    row.innerHTML=`<button class="cbtn clear" onclick="clearDraw()">↺ Volver a dibujar</button>`;
  } else if(!compared){
    row.innerHTML=`
      <button class="cbtn clear" onclick="clearDraw()">↺ Volver a dibujar</button>
      <button class="cbtn check" onclick="showModel()">Ver respuesta</button>
    `;
  } else {
    row.innerHTML=`<button class="cbtn clear" onclick="clearAndHide()">↺ Volver a dibujar</button>`;
  }
}

function showModel(){
  compared=true;
  drawRef(deck[idx].char);
  document.getElementById('refSection').style.display='flex';
  document.getElementById('drawCanvas').style.pointerEvents='none';
  document.getElementById('canvasWrap').classList.add('locked');
  renderBtns();
}

function clearDraw(){
  const c=document.getElementById('drawCanvas');
  c.getContext('2d').clearRect(0,0,c.width,c.height);
}

function clearAndHide(){
  compared=false;
  clearDraw();
  document.getElementById('refSection').style.display='none';
  document.getElementById('drawCanvas').style.pointerEvents='auto';
  document.getElementById('canvasWrap').classList.remove('locked');
  renderBtns();
}

// ── DRAWING ───────────────────────────────────────────────────────
function setupDrawing(){
  const canvas=document.getElementById('drawCanvas');
  const ctx=canvas.getContext('2d');
  ctx.strokeStyle='#1a1209'; ctx.lineWidth=6;
  ctx.lineCap='round'; ctx.lineJoin='round';
  let drawing=false, lx=0, ly=0;
  ctx.lineWidth=deck[idx].type==='combined'?5:6;

  function getPos(e){
    const r=canvas.getBoundingClientRect();
    const sx=canvas.width/r.width, sy=canvas.height/r.height;
    if(e.touches) return {x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy};
    return {x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};
  }
  function start(e){e.preventDefault();drawing=true;const p=getPos(e);lx=p.x;ly=p.y;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fillStyle='#1a1209';ctx.fill();}
  function move(e){if(!drawing)return;e.preventDefault();const p=getPos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;}
  function stop(){drawing=false;}

  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',stop);
  canvas.addEventListener('mouseleave',stop);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',stop);
  canvas.addEventListener('pointerdown',start);
  canvas.addEventListener('pointermove',(e)=>{if(e.buttons>0)move(e);});
  canvas.addEventListener('pointerup',stop);
}

// ── NAV ───────────────────────────────────────────────────────────
function goTo(i){
  if(i<0) return;
  if(i>=deck.length){showDone();return;}
  idx=i; renderCard();
}

function showDone(){
  document.getElementById('mainCard').style.display='none';
  document.querySelector('.nav-controls').style.display='none';
  document.getElementById('doneMsg').style.display='block';
}

// ── START ─────────────────────────────────────────────────────────
init();

function reviewAll(){
  idx=0;
  document.getElementById('doneMsg').style.display='none';
  document.getElementById('mainCard').style.display='block';
  document.querySelector('.nav-controls').style.display='flex';
  goTo(0);
}
</script>
