<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horas del reloj — Nihongo con Ferdi</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f5f0eb;min-height:100vh;padding:1.5rem 1rem;display:flex;flex-direction:column;align-items:center;}
.torii-home{position:fixed;top:14px;left:14px;z-index:999;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.85;transition:opacity .2s,transform .2s}
.torii-home:hover{opacity:1;transform:scale(1.08)}
.torii-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c0392b;font-family:sans-serif;font-weight:600}

h1{font-size:1rem;font-weight:600;color:#555;margin-bottom:.2rem;text-align:center;margin-top:.5rem}
.subtitle{font-size:.8rem;color:#a08070;margin-bottom:1rem;text-align:center;font-style:italic}

/* mode switch */
.mode-bar{display:flex;gap:6px;margin-bottom:1.25rem;background:#fff;border:1px solid #e0d8d0;border-radius:99px;padding:4px}
.mbtn{font-size:12px;padding:5px 16px;border-radius:99px;border:none;background:transparent;color:#888;cursor:pointer;transition:all .2s;font-family:inherit;font-weight:500}
.mbtn.active{background:#3b72d4;color:#fff}

/* progress */
.prog-bar-wrap{height:3px;background:#ddd;border-radius:2px;margin-bottom:.4rem;overflow:hidden;width:100%;max-width:560px}
.prog-bar-fill{height:100%;background:#3b72d4;border-radius:2px;transition:width .3s}
.prog-text{font-size:11px;color:#aaa;text-align:center;margin-bottom:.75rem}

/* card */
.card{background:#fff;border:1px solid #e0d8d0;border-radius:16px;padding:1.5rem 1.25rem;width:100%;max-width:560px;margin-bottom:.75rem}
.card-meta{font-size:11px;font-weight:600;color:#bbb;letter-spacing:.07em;text-transform:uppercase;margin-bottom:.5rem;display:flex;justify-content:space-between}
.card-status{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.card-status.ok{background:#e8f5ec;color:#2d7a3e}
.card-status.err{background:#fdecea;color:#b03030}
.card-status.revealed{background:#fdf6e3;color:#8a6800}

/* prompt */
.prompt{font-size:2rem;font-weight:600;color:#1a1209;text-align:center;margin-bottom:1rem;letter-spacing:.05em}
.prompt.hira{font-size:1.3rem;font-weight:400;line-height:1.8}

/* reference */
.reference{font-size:.75rem;color:#aaa;text-align:center;margin-bottom:.75rem;font-style:italic}
.reference span{color:#3b72d4;font-weight:500}

/* answer slots (dig→hira) */
.answer-slots{min-height:46px;background:#faf7f2;border:2px dashed #d8d0c8;border-radius:12px;padding:.5rem .75rem;display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:.5rem;transition:border-color .2s;flex:1}
.answer-slots.has-content{border-style:solid;border-color:#3b72d4}
.answer-slots.state-ok{border-color:#2d7a3e;background:#f0faf2}
.answer-slots.state-err{border-color:#c03030;background:#fdf0f0;animation:shake .35s ease}
.answer-slots.state-revealed{border-color:#c8a800;background:#fffbe6}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.ans-slot{font-size:.95rem;padding:4px 10px;border-radius:8px;background:#3b72d4;color:#fff;cursor:pointer;border:none;font-family:inherit;white-space:nowrap}
.ans-slot:hover{opacity:.8}
.ans-slot.state-ok{background:#2d7a3e}
.ans-slot.state-err{background:#c03030}
.ans-slot.state-revealed{background:#c8a800}

.slot-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:.5rem}
.del-btn{font-size:17px;padding:7px 12px;border-radius:10px;border:1px solid #ddd;background:#f7f4f0;color:#888;cursor:pointer;flex-shrink:0}
.del-btn:hover:not(:disabled){background:#ece8e0}
.del-btn:disabled{opacity:.3;cursor:default}

.block-pool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.5rem}
.block-btn{font-size:.95rem;padding:7px 12px;border-radius:10px;border:1.5px solid #d8d0c8;background:#fff;color:#222;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.block-btn:hover:not(:disabled){background:#f5ede8;border-color:#3b72d4}
.block-btn:active:not(:disabled){transform:scale(.93)}
.block-btn:disabled{opacity:.2;cursor:default}

/* free input (hira→dig) */
.free-input{font-size:1.1rem;padding:10px 14px;border-radius:10px;border:2px solid #d8d8d0;background:#fafaf7;color:#222;font-family:sans-serif;outline:none;width:100%;max-width:220px;transition:border-color .15s}
.free-input:focus{border-color:#3b72d4}
.free-input.state-ok{border-color:#2d7a3e;background:#f0faf2}
.free-input.state-err{border-color:#c03030;background:#fdf0f0;animation:shake .35s ease}
.free-input.state-revealed{border-color:#c8a800;background:#fffbe6}

.feedback{min-height:20px;font-size:.82rem;font-weight:500;text-align:center;margin-bottom:.4rem}
.feedback.ok{color:#2d7a3e}
.feedback.err{color:#b03030}
.feedback.hint{color:#aaa}
.action-row{display:flex;gap:8px;justify-content:center;margin-bottom:.4rem;flex-wrap:wrap}
.abtn{font-size:12px;padding:6px 14px;border-radius:10px;border:1px solid #ddd;background:#f7f4f0;color:#333;cursor:pointer;font-weight:500;font-family:inherit;transition:all .15s}
.abtn:hover{background:#ece8e0}
.abtn.check{background:#3b72d4;color:#fff;border-color:transparent}
.abtn.reveal{background:#fdf6e3;color:#8a6800;border-color:transparent}
.abtn.retry{background:#fdecea;color:#b03030;border-color:transparent}

.nav-controls{display:flex;gap:8px;justify-content:center;margin-bottom:.75rem;width:100%;max-width:560px}
.nav-btn{font-size:13px;padding:9px 20px;border-radius:10px;border:1px solid #ddd;background:#f7f4f0;color:#333;cursor:pointer;transition:all .15s;font-weight:500;font-family:inherit}
.nav-btn:hover:not(:disabled){background:#ece8e0}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn.primary{background:#3b72d4;color:#fff;border-color:transparent}
.nav-btn.primary:hover:not(:disabled){background:#2f5eab}
.stats-bar{display:flex;gap:8px;justify-content:center;font-size:12px;flex-wrap:wrap;margin-bottom:1rem}
.stat{padding:3px 10px;border-radius:99px;background:#f0ebe5;color:#aaa}
.stat.s-ok{color:#2d7a3e}
.stat.s-err{color:#b03030}
.done-msg{background:#fff;border:1px solid #e0d8d0;border-radius:16px;padding:2.5rem 1.5rem;text-align:center;max-width:560px;width:100%}
.done-msg h2{font-size:1.3rem;font-weight:500;margin-bottom:.5rem}
.done-msg p{font-size:.9rem;color:#777;margin-bottom:1.5rem}
.done-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>

<a class="torii-home" href="./" title="Inicio">
  <svg width="44" height="38" viewBox="0 0 44 38" xmlns="http://www.w3.org/2000/svg">

    <ellipse cx="22" cy="37" rx="14" ry="2.5" fill="rgba(0,0,0,.13)"/>

    <rect x="5" y="11" width="34" height="3" rx="1" fill="#b03020" filter="url(#grain)"/>
    <path d="M4,8.5 Q22,7 40,8.5" stroke="rgba(255,255,255,.18)" stroke-width="1" fill="none"/>

<h1>時計 — Horas del reloj</h1>
<p class="subtitle">Practica leer y escribir la hora en japonés</p>

<div class="mode-bar">
  <button class="mbtn active" id="btnDig" onclick="setMode('dig')">Digital → Hiragana</button>
  <button class="mbtn" id="btnHira" onclick="setMode('hira')">Hiragana → Digital</button>
</div>

<div class="prog-bar-wrap"><div class="prog-bar-fill" id="progBar" style="width:0%"></div></div>
<div class="prog-text" id="progText"></div>

<div class="card" id="mainCard">
  <div class="card-meta"><span id="cardType"></span><span id="cardStatus" class="card-status"></span></div>
  <div class="prompt" id="prompt"></div>
  <div class="reference" id="reference"></div>
  <div id="inputArea"></div>
  <div class="feedback" id="feedback"></div>
  <div class="action-row" id="actionRow"></div>
</div>

<div class="nav-controls">
  <button class="nav-btn" id="btnPrev" onclick="goTo(idx-1)" disabled>← Anterior</button>
  <button class="nav-btn primary" id="btnNext" onclick="goNext()">Siguiente →</button>
</div>
<div class="stats-bar">
  <span class="stat" id="statTotal"></span>
  <span class="stat s-ok" id="statOk"></span>
  <span class="stat s-err" id="statErr"></span>
  <span class="stat" id="statBlank"></span>
</div>

<div class="done-msg" id="doneMsg" style="display:none">
  <h2>¡Sección completa! 🎉</h2>
  <p id="doneSummary"></p>
  <div class="done-btns">
    <button class="nav-btn" onclick="init()">Repetir todo</button>
    <button class="nav-btn" onclick="reviewAll()">← Repasar mis respuestas</button>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────
// Hours in hiragana
const HIJI = {1:'いち',2:'に',3:'さん',4:'よ',5:'ご',6:'ろく',7:'しち',8:'はち',9:'く',10:'じゅう',11:'じゅういち',12:'じゅうに'};

// Minute tens (0=none, 10=じゅっ, 20=にじゅっ, etc.)
const MIN_TENS = {0:'',10:'じゅっ',20:'にじゅっ',30:'さんじゅっ',40:'よんじゅう',50:'ごじゅっ'};
// Minute units (irregular)
const MIN_UNITS = {0:'',1:'いっ',2:'に',3:'さん',4:'よん',5:'ご',6:'ろっ',7:'なな',8:'はっ',9:'きゅう'};
// fun vs pun — units ending in っ use ぷん, others ふん
function funOrPun(unit){ return ['いっ','ろっ','はっ','じゅっ','にじゅっ','さんじゅっ','よんじゅっ','ごじゅっ'].includes(unit)?'ぷん':'ふん'; }
// Minutes — irregular forms
const HIFUN = {
  0:'',
  1:'いっぷん',2:'にふん',3:'さんぷん',4:'よんぷん',5:'ごふん',
  6:'ろっぷん',7:'ななふん',8:'はっぷん',9:'きゅうふん',10:'じゅっぷん',
  11:'じゅういっぷん',12:'じゅうにふん',13:'じゅうさんぷん',14:'じゅうよんぷん',15:'じゅうごふん',
  16:'じゅうろっぷん',17:'じゅうななふん',18:'じゅうはっぷん',19:'じゅうきゅうふん',20:'にじゅっぷん',
  21:'にじゅういっぷん',22:'にじゅうにふん',23:'にじゅうさんぷん',24:'にじゅうよんぷん',25:'にじゅうごふん',
  26:'にじゅうろっぷん',27:'にじゅうななふん',28:'にじゅうはっぷん',29:'にじゅうきゅうふん',30:'はん',
  31:'さんじゅういっぷん',32:'さんじゅうにふん',33:'さんじゅうさんぷん',34:'さんじゅうよんぷん',35:'さんじゅうごふん',
  36:'さんじゅうろっぷん',37:'さんじゅうななふん',38:'さんじゅうはっぷん',39:'さんじゅうきゅうふん',40:'よんじゅっぷん',
  41:'よんじゅういっぷん',42:'よんじゅうにふん',43:'よんじゅうさんぷん',44:'よんじゅうよんぷん',45:'よんじゅうごふん',
  46:'よんじゅうろっぷん',47:'よんじゅうななふん',48:'よんじゅうはっぷん',49:'よんじゅうきゅうふん',50:'ごじゅっぷん',
  51:'ごじゅういっぷん',52:'ごじゅうにふん',53:'ごじゅうさんぷん',54:'ごじゅうよんぷん',55:'ごじゅうごふん',
  56:'ごじゅうろっぷん',57:'ごじゅうななふん',58:'ごじゅうはっぷん',59:'ごじゅうきゅうふん'
};

// DIG→HIRA deck (10 items) — shown as "8:20 pm", answer in blocks
const DIG_DECK = [
  {h:3,m:45,ampm:'pm'},{h:11,m:41,ampm:'am'},{h:5,m:30,ampm:'am'},
  {h:12,m:36,ampm:'pm'},{h:3,m:0,ampm:'pm'},{h:7,m:15,ampm:'am'},
  {h:9,m:48,ampm:'pm'},{h:1,m:6,ampm:'am'},{h:6,m:0,ampm:'pm'},
  {h:10,m:55,ampm:'am'}
];

// HIRA→DIG deck (10 different items)
const HIRA_DECK = [
  {h:2,m:10,ampm:'pm'},{h:4,m:30,ampm:'am'},{h:11,m:8,ampm:'pm'},
  {h:7,m:45,ampm:'am'},{h:3,m:21,ampm:'pm'},{h:9,m:0,ampm:'am'},
  {h:12,m:16,ampm:'pm'},{h:6,m:38,ampm:'am'},{h:1,m:50,ampm:'pm'},
  {h:8,m:3,ampm:'am'}
];

// Build hiragana sentence for a time entry
function toHira(entry){
  const ampm = entry.ampm==='am'?'ごぜん':'ごご';
  const ji = HIJI[entry.h]+'じ';
  const fun = entry.m===30?'はん':(entry.m===0?'':HIFUN[entry.m]);
  return ampm+' '+ji+(fun?' '+fun:'')+' です';
}

// Build digital string
function toDig(entry){
  const mm = entry.m.toString().padStart(2,'0');
  return entry.h+':'+mm+' '+entry.ampm;
}

// Build correct tokens for dig→hira (fractioned)
function toTokens(entry){
  const ampm = entry.ampm==='am'?'ごぜん':'ごご';
  const tokens = [ampm, HIJI[entry.h], 'じ'];
  if(entry.m===30){
    tokens.push('はん');
  } else if(entry.m!==0){
    const tens = Math.floor(entry.m/10)*10;
    const units = entry.m%10;
    const tensStr = MIN_TENS[tens]||'';
    const unitsStr = MIN_UNITS[units]||'';
    // determine fun/pun based on last mora
    const lastPart = unitsStr||tensStr;
    const fp = funOrPun(lastPart);
    if(tensStr) tokens.push(tensStr);
    if(unitsStr) tokens.push(unitsStr);
    tokens.push(fp);
  }
  tokens.push('です。');
  return tokens;
}

// Build distractor pool — 4 distractors total
function buildPool(entry){
  const correct = toTokens(entry);
  const correctSet = new Set(correct);
  const candidates = [];

  // Wrong ampm
  candidates.push(entry.ampm==='am'?'ごご':'ごぜん');
  // Wrong hour
  const wrongH = entry.h===12?1:(entry.h===1?3:entry.h+1);
  candidates.push(HIJI[wrongH]);
  // Wrong tens or units for minutes
  if(entry.m===30){
    candidates.push('にじゅっ','ご','ぷん');
  } else if(entry.m===0){
    candidates.push('はん','ごじゅっ','ふん');
  } else {
    const tens = Math.floor(entry.m/10)*10;
    const units = entry.m%10;
    // wrong tens
    const wrongTens = tens===0?'にじゅっ':(tens===20?'さんじゅっ':'にじゅっ');
    candidates.push(wrongTens);
    // wrong units
    const wrongUnit = units===0?'に':(units===1?'に':(units===5?'よん':'ご'));
    candidates.push(wrongUnit);
    // wrong fun/pun
    candidates.push(entry.m%10===0||[1,6,8].includes(entry.m%10)?'ふん':'ぷん');
    // はん as distractor when not 30
    candidates.push('はん');
  }

  const extras = [...new Set(candidates.filter(d=>!correctSet.has(d)))];
  shuffle(extras);
  const pool = [...correct, ...extras.slice(0,4)];
  return shuffle(pool);
}

// ── STATE ─────────────────────────────────────────────────────────
let mode='dig', deck=[], idx=0, cardStates=[];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function setMode(m){
  mode=m;
  document.getElementById('btnDig').classList.toggle('active',m==='dig');
  document.getElementById('btnHira').classList.toggle('active',m==='hira');
  init();
}

function init(){
  deck = mode==='dig' ? [...DIG_DECK] : [...HIRA_DECK];
  cardStates = new Array(deck.length).fill(null);
  idx=0;
  document.getElementById('doneMsg').style.display='none';
  document.getElementById('mainCard').style.display='block';
  document.querySelector('.nav-controls').style.display='flex';
  render(); updateStats();
}

function initState(i){
  if(!cardStates[i]){
    if(mode==='dig'){
      const tokens=toTokens(deck[i]);
      const buttons=buildPool(deck[i]);
      cardStates[i]={phase:'input',answer:[],buttons,tokens,hadError:false};
    } else {
      cardStates[i]={phase:'input',typed:'',hadError:false};
    }
  }
}

// ── RENDER ────────────────────────────────────────────────────────
function render(){
  initState(idx);
  const q=deck[idx], st=cardStates[idx];

  const pct=Math.round((idx/(deck.length-1||1))*100);
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progText').textContent=(idx+1)+' / '+deck.length;

  const labels={input:'',correct:'✓ Correcto',wrong:'✗ Incorrecto',revealed:'👁 Revelado'};
  const cls={input:'',correct:'ok',wrong:'err',revealed:'revealed'};
  const badge=document.getElementById('cardStatus');
  badge.textContent=labels[st.phase]; badge.className='card-status'+(cls[st.phase]?' '+cls[st.phase]:'');

  document.getElementById('cardType').textContent=mode==='dig'?'Digital → Hiragana':'Hiragana → Digital';

  const promptEl=document.getElementById('prompt');
  const refEl=document.getElementById('reference');

  if(mode==='dig'){
    promptEl.textContent=toDig(q);
    promptEl.className='prompt';
    refEl.innerHTML='Referencia: <span>8:20 pm</span> → ごご はちじ にじゅっぷん です。';
    renderDigInput(q,st);
  } else {
    promptEl.innerHTML=toHira(q).replace(/ /g,'　');
    promptEl.className='prompt hira';
    refEl.innerHTML='Referencia: <span>ごご はちじ にじゅっぷん です</span> → 8:20 pm';
    renderHiraInput(q,st);
  }

  setFeedback('','hint');
  renderActions(st,q);
  document.getElementById('btnPrev').disabled=(idx===0);
  const done=st.phase!=='input';
  const btn=document.getElementById('btnNext');
  btn.disabled=!done; btn.className='nav-btn'+(done?' primary':'');
  btn.textContent=(idx===deck.length-1&&done)?'Ver resultados →':'Siguiente →';
}

// ── DIG→HIRA INPUT ────────────────────────────────────────────────
function renderDigInput(q,st){
  const area=document.getElementById('inputArea');
  const done=st.phase!=='input';
  const hasContent=st.answer.length>0;
  const slotClass=done?' state-'+st.phase:'';

  // Build slots
  const slotsDiv=document.createElement('div');
  slotsDiv.className='answer-slots'+(hasContent?' has-content':'')+slotClass;
  slotsDiv.id='ansSlots';
  st.answer.forEach((tok,i)=>{
    const b=document.createElement('button');
    b.className='ans-slot'+(done?' state-'+st.phase:'');
    b.textContent=tok;
    if(!done) b.onclick=(()=>{const pos=i;return()=>removeAt(pos);})();
    slotsDiv.appendChild(b);
  });

  // del button
  const delBtn=document.createElement('button');
  delBtn.className='del-btn';
  delBtn.textContent='←';
  delBtn.disabled=done||st.answer.length===0;
  delBtn.onclick=deleteLast;

  const slotRow=document.createElement('div');
  slotRow.className='slot-row';
  slotRow.appendChild(slotsDiv);
  slotRow.appendChild(delBtn);

  // pool
  const poolDiv=document.createElement('div');
  poolDiv.className='block-pool';
  const usedIdxs=getUsedIdxs(st.answer,st.buttons);
  st.buttons.forEach((k,i)=>{
    const b=document.createElement('button');
    b.className='block-btn';
    b.textContent=k;
    b.disabled=done||usedIdxs.has(i);
    if(!done&&!usedIdxs.has(i)) b.onclick=(()=>{const ki=i,kk=k;return()=>handleBlock(kk,ki);})();
    poolDiv.appendChild(b);
  });

  area.innerHTML='';
  area.appendChild(slotRow);
  area.appendChild(poolDiv);
}
function getUsedIdxs(answer,buttons){
  const used=new Set();
  for(const t of answer){
    for(let i=0;i<buttons.length;i++){
      if(buttons[i]===t&&!used.has(i)){used.add(i);break;}
    }
  }
  return used;
}

function handleBlock(k,btnIdx){
  const st=cardStates[idx];
  if(st.phase!=='input')return;
  const maxLen=st.tokens.length;
  if(st.answer.length>=maxLen)return;
  st.answer.push(k);
  render();
  if(st.answer.length===maxLen) setTimeout(verifyDig,120);
}

function removeAt(pos){
  const st=cardStates[idx];
  if(st.phase!=='input')return;
  st.answer.splice(pos,1);
  render();
}

function deleteLast(){
  const st=cardStates[idx];
  if(st.answer.length===0||st.phase!=='input')return;
  st.answer.pop();
  render();
}

function verifyDig(){
  const st=cardStates[idx];
  const ok=st.answer.every((t,i)=>t===st.tokens[i]);
  st.phase=ok?'correct':'wrong';
  if(!ok)st.hadError=true;
  updateStats(); render();
}

// ── HIRA→DIG INPUT ───────────────────────────────────────────────
function renderHiraInput(q,st){
  const area=document.getElementById('inputArea');
  const done=st.phase!=='input';
  const correct=toDig(q);

  if(!done){
    area.innerHTML=
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:.5rem">'+
        '<input class="free-input" id="hiraInput" type="text" placeholder="ej. 3:05 pm" '+
        'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" '+
        'onkeydown="if(event.key===\'Enter\')verifyHira()">'+
        '<button class="abtn check" onclick="verifyHira()">→</button>'+
      '</div>';
    setTimeout(()=>document.getElementById('hiraInput')?.focus(),50);
    if(st.typed) document.getElementById('hiraInput').value=st.typed;
  } else {
    const color=st.phase==='correct'?'#2d7a3e':st.phase==='wrong'?'#c03030':'#c8a800';
    area.innerHTML=
      '<div style="font-size:1.2rem;font-weight:600;color:'+color+';text-align:center;padding:.5rem 0">'+
        (st.phase==='wrong'?'✗ '+st.typed+' → ✓ '+correct:correct)+
      '</div>';
  }
}

function verifyHira(){
  const st=cardStates[idx];
  if(st.phase!=='input')return;
  const input=document.getElementById('hiraInput');
  const val=(input?.value||st.typed||'').trim().toLowerCase();
  if(!val)return;
  st.typed=val;
  const correct=toDig(deck[idx]).toLowerCase();
  // flexible: allow space variations
  const norm=s=>s.replace(/\s+/g,'');
  st.phase=(norm(val)===norm(correct))?'correct':'wrong';
  if(st.phase==='wrong')st.hadError=true;
  updateStats(); render();
}

// ── ACTIONS ───────────────────────────────────────────────────────
function renderActions(st,q){
  const row=document.getElementById('actionRow');
  row.innerHTML='';
  if(st.phase==='input'){
    const r=document.createElement('button');
    r.className='abtn reveal'; r.textContent='👁 Ver respuesta';
    r.onclick=()=>{
      if(mode==='dig'){ st.answer=[...st.tokens]; }
      else { st.typed=toDig(q); }
      st.phase='revealed'; updateStats(); render();
    };
    row.appendChild(r);
  } else if(st.phase==='wrong'){
    setFeedback(mode==='dig'?'Incorrecto — ↺ inténtalo de nuevo':'Incorrecto','err');
    const retry=document.createElement('button');
    retry.className='abtn retry'; retry.textContent='↺ Reintentar';
    retry.onclick=()=>{ st.phase='input'; st.answer=[]; st.typed=''; render(); };
    row.appendChild(retry);
  } else if(st.phase==='correct'){
    setFeedback(st.hadError?'¡Correcto! (con reintento)':'¡Perfecto! ✓','ok');
  } else {
    setFeedback('Respuesta revelada','hint');
  }
}

function setFeedback(msg,cls){
  const el=document.getElementById('feedback');
  el.textContent=msg; el.className='feedback'+(cls?' '+cls:'');
}

// ── NAV ───────────────────────────────────────────────────────────
function goTo(i){
  if(i<0||i>=deck.length)return;
  idx=i;
  document.getElementById('doneMsg').style.display='none';
  document.getElementById('mainCard').style.display='block';
  document.querySelector('.nav-controls').style.display='flex';
  render();
}
function goNext(){ if(idx===deck.length-1){showDone();return;} idx++;render(); }
function reviewAll(){
  idx=0;
  document.getElementById('doneMsg').style.display='none';
  document.getElementById('mainCard').style.display='block';
  document.querySelector('.nav-controls').style.display='flex';
  render();
}
function updateStats(){
  let ok=0,err=0,rev=0,blank=0;
  for(const s of cardStates){
    if(!s||s.phase==='input')blank++;
    else if(s.phase==='correct'&&!s.hadError)ok++;
    else if(s.phase==='correct'&&s.hadError)err++;
    else if(s.phase==='wrong')err++;
    else if(s.phase==='revealed')rev++;
  }
  document.getElementById('statTotal').textContent='Total: '+deck.length;
  document.getElementById('statOk').textContent='✓ '+ok;
  document.getElementById('statErr').textContent='✗ '+(err+rev);
  document.getElementById('statBlank').textContent='— '+blank;
}
function showDone(){
  document.getElementById('mainCard').style.display='none';
  document.querySelector('.nav-controls').style.display='none';
  document.getElementById('doneMsg').style.display='block';
  let ok=0,err=0,rev=0;
  for(const s of cardStates){
    if(!s||s.phase==='input')continue;
    if(s.phase==='correct'&&!s.hadError)ok++;
    else if(s.phase==='correct'&&s.hadError)err++;
    else if(s.phase==='wrong')err++;
    else if(s.phase==='revealed')rev++;
  }
  document.getElementById('doneSummary').textContent='✓ '+ok+' perfectas · ✗ '+(err+rev)+' con errores · 👁 '+rev+' reveladas.';
}

init();
</script>
