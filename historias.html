<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini historias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Paleta del sitio: fondo #f5f0eb, tarjeta blanca con borde #e0d8d0, tinta #1a1209,
   rojo #c0392b (torii) y azul #3b72d4 (etiquetas de lección, como en vocab.html).
   Layout: título pequeño centrado, una tarjeta con la historia, globito anclado a la palabra. */
:root{
  --bg:#f5f0eb;
  --card:#ffffff;
  --fg:#1a1209;
  --muted:#a08070;
  --rt:#8a6a58;
  --red:#c0392b;
  --blue:#3b72d4;
  --blue-bg:#eef3ff;
  --hl:rgba(59,114,212,.17);
  --hl-soft:rgba(59,114,212,.08);
  --rule:#e0d8d0;
  --serif:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Noto Sans JP',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  min-height:100vh;padding:1.5rem clamp(12px,2.5vw,32px) 3rem;
}
/* Todo escala con el ancho de la ventana: la tarjeta se ensancha o se estrecha
   y la letra crece o se encoge con ella (también al girar el teléfono). */
.page{--fs:clamp(1.25rem,.9rem + 1.8vw,2.2rem);max-width:min(100%,62rem);margin-inline:auto;display:grid;gap:1.1rem}

.site-h1{margin:.5rem 0 0;text-align:center;font-size:1rem;font-weight:500;color:#555;letter-spacing:.05em}
.subtitle{margin:0;text-align:center;font-size:.8rem;color:var(--muted);font-style:italic;line-height:1.5}

.card{
  background:var(--card);border:1px solid var(--rule);border-radius:20px;
  padding:clamp(1.1rem,2.4vw,2.5rem) clamp(1rem,3.2vw,2.75rem) clamp(1.25rem,2.8vw,2.75rem);
}
#title{
  margin:0;text-align:center;font-family:var(--serif);font-weight:500;
  font-size:clamp(1.5rem,1rem + 2.6vw,3rem);line-height:2;letter-spacing:.06em;
}
.byline{
  margin:0 0 1.25rem;padding-bottom:1rem;border-bottom:1px solid var(--rule);
  text-align:center;font-size:.8rem;color:var(--muted);line-height:1.5;
}

.story{display:grid;gap:clamp(1.1rem,2.4vw,2rem)}
.story p{
  margin:0;
  font-family:var(--serif);font-weight:400;
  font-size:var(--fs);
  line-height:2.75;
  letter-spacing:.05em;
  word-spacing:.12em;
  line-break:strict;
}
ruby{ruby-align:center}
.bun{white-space:nowrap}
.w.long{white-space:normal} /* palabras muy largas: pueden partirse si no caben en el renglón */
rt{
  font-family:var(--sans);font-weight:400;
  font-size:.44em;letter-spacing:.02em;line-height:1;color:var(--rt);
}

.w{
  white-space:nowrap;cursor:pointer;border-radius:.25em;
  transition:background .15s;-webkit-tap-highlight-color:transparent;
}
@media (hover:hover){ .w:hover{background:var(--hl-soft)} }
.w.on{background:var(--hl)}
.w:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

footer{text-align:center;font-size:.75rem;color:var(--muted);font-style:italic;line-height:1.5}

.tip{
  position:absolute;z-index:20;
  width:max-content;max-width:min(19rem,calc(100vw - 16px));
  background:var(--card);color:var(--fg);
  border:1px solid var(--rule);border-radius:14px;padding:.7rem .95rem .8rem;
  box-shadow:0 8px 28px rgba(26,18,9,.18);
  display:grid;gap:.25rem;
  animation:pop .14s ease-out;
}
.tip::after{
  content:"";position:absolute;left:var(--ax,50%);
  width:11px;height:11px;background:var(--card);
  transform:translateX(-50%) rotate(45deg);
}
.tip[data-pos="above"]::after{bottom:-6px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tip[data-pos="below"]::after{top:-6px;border-left:1px solid var(--rule);border-top:1px solid var(--rule)}
.tip-jp{font-family:var(--serif);font-size:1.45rem;line-height:2;letter-spacing:.05em}
.tip rt{color:var(--rt)}
.tip-es{font-size:1.02rem;font-weight:500;line-height:1.35}
.tip-meta{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-top:.15rem}
.tip-l{
  font-size:.65rem;font-weight:700;color:var(--blue);background:var(--blue-bg);
  padding:2px 8px;border-radius:99px;white-space:nowrap;
}
.tip-note{font-size:.76rem;line-height:1.4;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .tip{animation:none} .w{transition:none} }

/* ---- selección de personajes ---- */
.back{
  justify-self:start;display:inline-flex;align-items:center;gap:.4rem;
  font-size:.8rem;font-weight:500;color:var(--blue);background:var(--blue-bg);
  text-decoration:none;border-radius:99px;padding:.4rem 1rem;
}
.back:hover{background:#dfe8ff}
.back:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.cast{display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem;margin-top:.4rem;container-type:inline-size}
.person{
  --h:10.75rem; /* tamaño fijo en celular: al girar el teléfono sólo se reacomodan */
  position:relative;display:block;height:var(--h);padding:0;border:0;background:none;
  border-radius:16px;cursor:pointer;font:inherit;
  transition:transform .25s ease,box-shadow .25s ease;-webkit-tap-highlight-color:transparent;
}
.person img{display:block;height:100%;width:auto;border-radius:16px}
@media (hover:hover){ .person:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(26,18,9,.15)} }
.person:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.person.soon img{filter:saturate(.55) opacity(.74)}
/* Compu / tableta: 5 por fila (15 alumnos en 3 filas) y los dos profesores juntos al final */
@media (min-width:760px) and (min-height:501px){
  .cast{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:1rem;justify-items:center;align-items:center}
  .person{--h:min(15rem,calc((100cqw - 4rem) / 5 * 1.2));grid-column:span 2}
  .person:nth-child(16){grid-column:4 / span 2}
  .person:nth-child(17){grid-column:6 / span 2}
}

.person .chip{
  position:absolute;top:8px;right:8px;font-size:.62rem;font-weight:700;letter-spacing:.04em;
  color:var(--blue);background:#fff;border:1px solid var(--rule);border-radius:99px;padding:2px 8px;
}
.avatar{display:block;margin:0 auto .4rem;height:clamp(7rem,16vw,11rem);width:auto;border-radius:14px}
.toast{
  position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:50;max-width:calc(100vw - 32px);
  background:var(--fg);color:#fff;font-size:.85rem;line-height:1.4;text-align:center;
  padding:.65rem 1.1rem;border-radius:99px;box-shadow:0 8px 24px rgba(26,18,9,.25);
}
/* ---- torii (igual que en las otras páginas) ---- */
.torii-home{position:fixed;top:14px;left:14px;z-index:999;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.85;transition:opacity .2s,transform .2s}
.torii-home:hover{opacity:1;transform:scale(1.08)}
.torii-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c0392b;font-family:sans-serif;font-weight:600}
</style>


</head>

<main class="page">
  <h1 class="site-h1">おはなし · Mini historias</h1>
  <p class="subtitle" id="subtitle"></p>

  <section id="hubView" aria-label="Elige una historia">
    <div class="cast" id="cast"></div>
  </section>

  <section id="storyView" hidden>
    <a class="back" href="#">← Todas las historias</a>

      <img class="avatar" id="avatar" alt="" width="200" height="300">
      <h2 id="title" lang="ja"></h2>
      <p class="byline">Una historia con el vocabulario y la gramática de las lecciones 1 a 7.</p>
      <article class="story" id="story" lang="ja"></article>
    </section>
  </section>

  <footer>Los nombres propios van en katakana. Las lecciones (L1 a L7) coinciden con tu página de vocabulario.</footer>
</main>

<div id="tip" class="tip" role="tooltip" hidden>
  <div class="tip-jp" lang="ja"></div>

</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

];
const IMG_SIZE = {luis:[296,380],itzel:[296,380],lupita:[296,380],gris:[296,380],claudia:[296,380],santiago:[296,380],ireri:[296,380],jairo:[296,380],naomi:[296,380],david:[296,380],jesus:[296,380],joab:[296,380],yuri:[296,380],homero:[296,380],fernando:[296,380],paty:[296,380],andres:[296,380]};

/* ---------- Dibujo ---------- */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function rubyHTML(s){ return esc(s).replace(/\{([^:}]+):([^}]+)\}/g,"<ruby>$1<rt>$2</rt></ruby>"); }

/* Las palabras se agrupan en "frases" que no se parten entre renglones:
   el renglón sólo puede cortarse en un espacio, o después de “、” y “：”. */
function fill(container, tokens){
  var group = null;
  function open(){ if(!group){ group = document.createElement("span"); group.className = "bun"; container.appendChild(group); } return group; }
  function close(){ group = null; }
  tokens.forEach(function(t, i){
    if(t === _){ close(); container.appendChild(document.createTextNode(" ")); return; }
    var parts = t.split("¦");
    if(parts.length === 1){
      open().appendChild(document.createTextNode(t));
      var nx = tokens[i + 1];
      if(t === "、" || t === "：" || (t === "。" && nx !== undefined && nx !== _ && nx !== "」")){ close(); container.appendChild(document.createElement("wbr")); }
      return;
    }
    var span = document.createElement("span");
    span.className = parts[0].replace(/\{([^:}]+):[^}]+\}/g, "$1").length >= 9 ? "w long" : "w";
    span.tabIndex = 0;
    span.setAttribute("role","button");
    span.dataset.jp = parts[0];
    span.dataset.es = parts[1];
    span.dataset.note = parts[2] || "";
    span.innerHTML = rubyHTML(parts[0]);
    open().appendChild(span);
    if(parts[0] === "と"){ close(); container.appendChild(document.createElement("wbr")); }
  });
}

var hubView = document.getElementById("hubView");
var storyView = document.getElementById("storyView");
var subtitle = document.getElementById("subtitle");
var toast = document.getElementById("toast");
var toastTimer = null;

function buildHub(){
  var cast = document.getElementById("cast");
  PEOPLE.forEach(function(pr){
    var ready = !!STORIES[pr.id];
    var el = document.createElement(ready ? "a" : "button");
    el.className = "person" + (ready ? "" : " soon");
    el.setAttribute("aria-label", "Historia de " + pr.name + (ready ? "" : " (próximamente)"));
    if(ready){ el.href = "#" + pr.id; } else { el.type = "button"; el.dataset.name = pr.name; }
    var img = document.createElement("img");
    img.src = "historias_img/" + pr.id + ".webp";
    img.alt = "";
    img.width = IMG_SIZE[pr.id][0]; img.height = IMG_SIZE[pr.id][1];
    img.decoding = "async";
    el.appendChild(img);
    if(!ready){ var chip = document.createElement("span"); chip.className = "chip"; chip.textContent = "pronto"; el.appendChild(chip); }
    cast.appendChild(el);
  });
  cast.addEventListener("click", function(e){
    var b = e.target.closest(".person.soon");
    if(!b) return;
    toast.textContent = "La historia de " + b.dataset.name + " viene pronto.";
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.hidden = true; }, 2200);
  });
}

var renderedId = null;
function renderStory(id){
  if(renderedId === id) return;
  var st = STORIES[id];
  var t = document.getElementById("title"), body = document.getElementById("story");
  t.textContent = ""; body.textContent = "";
  fill(t, st.title);
  st.paragraphs.forEach(function(tokens){
    var p = document.createElement("p");
    fill(p, tokens);
    body.appendChild(p);
  });
  var av = document.getElementById("avatar");
  av.src = "historias_img/" + id + ".webp";
  av.width = IMG_SIZE[id][0]; av.height = IMG_SIZE[id][1];
  renderedId = id;
}

function route(){
  hideTip();
  var id = decodeURIComponent(location.hash.replace(/^#/, ""));
  if(STORIES[id]){
    renderStory(id);
    hubView.hidden = true; storyView.hidden = false;
    subtitle.textContent = "Toca una palabra para ver qué significa. Toca en cualquier otro lugar para cerrarlo.";
    var who = PEOPLE.filter(function(x){ return x.id === id; })[0];
    document.title = (who ? who.name : "Historia") + " · Mini historias";
  } else {
    hubView.hidden = false; storyView.hidden = true;
    subtitle.textContent = "Elige a un compañero para leer su historia.";
    document.title = "Mini historias";
  }
  window.scrollTo(0, 0);
}

buildHub();

/* ---------- Globito ---------- */
var tip = document.getElementById("tip");
var current = null;

function hideTip(){
  tip.hidden = true;
  if(current){ current.classList.remove("on"); current.removeAttribute("aria-describedby"); current = null; }
}

function showTip(el, ev){
  if(current) current.classList.remove("on");
  current = el;
  el.classList.add("on");
  el.setAttribute("aria-describedby","tip");
  tip.querySelector(".tip-jp").innerHTML = rubyHTML(el.dataset.jp);
  tip.querySelector(".tip-es").textContent = el.dataset.es;
  var n = el.dataset.note || "", lesson = "", rest = n;
  var lm = n.match(/(?:^|\s·\s)(L\d(?:\s*[–+]\s*L\d)?)$/);
  if(lm){ lesson = lm[1]; rest = n.slice(0, n.length - lm[0].length); }
  var lc = tip.querySelector(".tip-l"), nt = tip.querySelector(".tip-note");
  lc.textContent = lesson; lc.hidden = !lesson;
  nt.textContent = rest;   nt.hidden = !rest;
  tip.querySelector(".tip-meta").hidden = !(lesson || rest);
  tip.hidden = false;

  var rects = Array.prototype.slice.call(el.getClientRects());
  var r = rects[0];
  if(ev && ev.detail !== 0 && rects.length > 1){
    r = rects.filter(function(q){ return ev.clientY >= q.top && ev.clientY <= q.bottom; })[0] || rects[0];
  }
  var tw = tip.offsetWidth, th = tip.offsetHeight;
  var vw = document.documentElement.clientWidth;
  var cx = r.left + r.width/2;
  var left = Math.min(Math.max(cx - tw/2, 8), vw - tw - 8);
  var above = (r.top - th - 12) >= 8;
  var top = above ? (r.top - th - 10) : (r.bottom + 10);
  tip.style.left = (left + window.scrollX) + "px";
  tip.style.top  = (top + window.scrollY) + "px";
  tip.style.setProperty("--ax", Math.min(Math.max(cx - left, 16), tw - 16) + "px");
  tip.dataset.pos = above ? "above" : "below";
}

document.addEventListener("click", function(e){
  var w = e.target.closest(".w");
  if(w){
    if(w === current && !tip.hidden){ hideTip(); } else { showTip(w, e); }
    return;
  }
  if(e.target.closest("#tip")) return;
  hideTip();
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ hideTip(); return; }
  if((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("w")){
    e.preventDefault();
    e.target.click();
  }
});
window.addEventListener("resize", hideTip);
window.addEventListener("hashchange", route);
route();
