<title>Flashcards Nihongo — L1, L2, L3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f5f5f0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
#app{width:100%;max-width:560px}
h1{font-size:16px;font-weight:600;color:#444;margin-bottom:1.25rem;text-align:center;letter-spacing:.03em}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;flex-wrap:wrap;gap:8px}
.lesson-filters{display:flex;gap:6px}
.lbtn{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid #ccc;background:#fff;color:#888;cursor:pointer;transition:all .15s}
.lbtn.active{background:#3b72d4;color:#fff;border-color:transparent}
.dir-toggle{font-size:12px;padding:4px 14px;border-radius:99px;border:1px solid #ccc;background:#fff;color:#555;cursor:pointer}
.shuffle-btn{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid #ccc;background:#fff;color:#555;cursor:pointer}
.progress-text{font-size:12px;color:#999;text-align:center;margin-bottom:6px}
.prog-bar-wrap{height:3px;background:#ddd;border-radius:2px;margin-bottom:.9rem;overflow:hidden}
.prog-bar-fill{height:100%;background:#3b72d4;border-radius:2px;transition:width .3s}
.card-wrap{perspective:1000px;height:220px;cursor:pointer;margin-bottom:1rem}
.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1)}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid #e0e0d8;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;gap:10px}
.card-back{transform:rotateY(180deg)}
.card-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#aaa;position:absolute;top:14px;left:18px}
.card-lesson{font-size:11px;color:#bbb;position:absolute;top:14px;right:18px;font-weight:600}
.front-main{font-size:22px;font-weight:500;color:#222;text-align:center;white-space:pre-line;line-height:1.4}
.back-jp{font-size:32px;font-weight:500;color:#222;text-align:center;line-height:1.3}
.back-rom{font-size:14px;color:#888;text-align:center}
.card-hint{font-size:11px;color:#ccc;position:absolute;bottom:13px}
.controls{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:.9rem}
.btn{font-size:14px;padding:9px 22px;border-radius:10px;border:1px solid #ddd;background:#f7f7f4;color:#333;cursor:pointer;transition:all .15s;font-weight:500}
.btn:hover{background:#ececea}
.btn-know{background:#e8f5ec;color:#2d7a3e;border-color:transparent}
.btn-know:hover{background:#d4edda}
.btn-skip{background:#fdecea;color:#b03030;border-color:transparent}
.btn-skip:hover{background:#f9d6d4}
.counter{font-size:13px;color:#999;min-width:70px;text-align:center}
.stats-bar{display:flex;gap:8px;justify-content:center;font-size:12px;color:#aaa;flex-wrap:wrap}
.stat{padding:3px 10px;border-radius:99px;background:#f0f0eb}
.stat.known{color:#2d7a3e}
.stat.skipped{color:#b03030}
.done-msg{text-align:center;padding:2.5rem 1rem;background:#fff;border-radius:16px;border:1px solid #e0e0d8}
.done-msg h2{font-size:20px;font-weight:600;margin-bottom:8px;color:#222}
.done-msg p{font-size:14px;color:#777;margin-bottom:1.5rem}
.done-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ── TORII HOME BUTTON ── */
.torii-home{
  position:fixed;top:14px;left:14px;z-index:999;
  text-decoration:none;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  opacity:.85;transition:opacity .2s,transform .2s;
}
.torii-home:hover{opacity:1;transform:scale(1.08);}
.torii-label{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:#c0392b;font-family:sans-serif;font-weight:600;
}

<div id="app">
  <h1>Flashcards Nihongo</h1>
  <div class="top-bar">
    <div class="lesson-filters">
      <button class="lbtn active" onclick="toggleLesson(1,this)">L1</button>
      <button class="lbtn active" onclick="toggleLesson(2,this)">L2</button>
      <button class="lbtn active" onclick="toggleLesson(3,this)">L3</button>
    </div>
    <div style="display:flex;gap:6px">
      <button class="shuffle-btn" onclick="shuffleDeck()">⇄ Barajar</button>
      <button class="dir-toggle" id="dirBtn" onclick="toggleDir()">ES → JP</button>
    </div>
  </div>
  <div class="prog-bar-wrap"><div class="prog-bar-fill" id="progBar" style="width:0%"></div></div>
  <div class="progress-text" id="progressText"></div>
  <div class="card-wrap" id="cardWrap" onclick="flipCard()">
    <div class="card-inner" id="cardInner">
      <div class="card-face card-front">
        <span class="card-label" id="frontLabel">Español</span>
        <span class="card-lesson" id="cardLesson"></span>
        <div class="front-main" id="frontContent"></div>
        <span class="card-hint">toca para voltear</span>

      <div class="card-face card-back">

        <div class="back-jp" id="backJP"></div>
        <div class="back-rom" id="backRom"></div>
      </div>
    </div>
  </div>
  <div class="controls" id="ctrlBar">
    <button class="btn btn-skip" onclick="markCard(false)">✗ Repasar</button>
    <span class="counter" id="counter"></span>
    <button class="btn btn-know" onclick="markCard(true)">✓ Lo sé</button>
  </div>
  <div class="stats-bar">
    <span class="stat" id="statTotal"></span>
    <span class="stat known" id="statKnown"></span>
    <span class="stat skipped" id="statSkip"></span>
  </div>
  <div id="doneMsg" class="done-msg" style="display:none">
    <h2>¡Ronda completa! 🎉</h2>
    <p id="doneSummary"></p>
    <div class="done-btns">
      <button class="btn" onclick="restart(false)">Repetir todo</button>
      <button class="btn btn-skip" onclick="restart(true)">Solo repasar</button>
    </div>
  </div>
</div>

let deck=[],idx=0,flipped=false,known=0,skipped=0;
let activeLessons=new Set([1,2,3]);
let dirEsJp=true;

function buildDeck(){
  deck=ALL.filter(c=>activeLessons.has(c.l));
  idx=0;known=0;skipped=0;flipped=false;
  showCard();updateStats();
}

function shuffleDeck(){
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  idx=0;flipped=false;showCard();
}

function toggleLesson(n,btn){
  if(activeLessons.has(n)){
    if(activeLessons.size===1)return;
    activeLessons.delete(n);btn.classList.remove('active');
  }else{
    activeLessons.add(n);btn.classList.add('active');
  }
  buildDeck();
}

function toggleDir(){
  dirEsJp=!dirEsJp;
  document.getElementById('dirBtn').textContent=dirEsJp?'ES → JP':'JP → ES';
  flipped=false;
  document.getElementById('cardInner').classList.remove('flipped');
  showCard();
}

function showCard(){
  const done=document.getElementById('doneMsg');
  const wrap=document.getElementById('cardWrap');
  const ctrl=document.getElementById('ctrlBar');
  if(idx>=deck.length){
    done.style.display='block';wrap.style.display='none';ctrl.style.display='none';
    document.getElementById('doneSummary').textContent=
      'Sabías '+known+' de '+deck.length+' tarjetas. '+(skipped>0?'Quedan '+skipped+' para repasar.':'¡Perfecto, todas correctas!');
    return;
  }
  done.style.display='none';wrap.style.display='block';ctrl.style.display='flex';
  const c=deck[idx];
  if(dirEsJp){
    document.getElementById('frontLabel').textContent='Español';
    document.getElementById('frontContent').textContent=c.es;
    document.getElementById('backLabel').textContent='Japonés';
    document.getElementById('backJP').textContent=c.jp;
    document.getElementById('backRom').textContent=c.rom;
  }else{
    document.getElementById('frontLabel').textContent='Japonés';
    document.getElementById('frontContent').textContent=c.jp+'\n'+c.rom;
    document.getElementById('backLabel').textContent='Español';
    document.getElementById('backJP').textContent=c.es;
    document.getElementById('backRom').textContent='';
  }
  document.getElementById('cardLesson').textContent='L'+c.l;
  document.getElementById('counter').textContent=(idx+1)+' / '+deck.length;
  const pct=Math.round((idx/deck.length)*100);
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progressText').textContent=pct+'% completado';
  document.getElementById('cardInner').classList.remove('flipped');
  flipped=false;
}

function flipCard(){
  flipped=!flipped;
  document.getElementById('cardInner').classList.toggle('flipped',flipped);
}

function markCard(isKnown){
  if(isKnown)known++;else skipped++;
  idx++;
  updateStats();
  showCard();
}

function updateStats(){
  document.getElementById('statTotal').textContent='Total: '+deck.length;
  document.getElementById('statKnown').textContent='✓ '+known;
  document.getElementById('statSkip').textContent='✗ '+skipped;
}

function restart(onlySkipped){
  buildDeck();
  shuffleDeck();
}

buildDeck();
shuffleDeck();
</script>
