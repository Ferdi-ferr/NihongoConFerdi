<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>じんぶつ — Nihongo con Ferdi</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:#f5f0eb;min-height:100vh;padding:1rem;}

/* torii */
.torii-home{position:fixed;top:14px;left:14px;z-index:999;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.85;transition:opacity .2s,transform .2s}
.torii-home:hover{opacity:1;transform:scale(1.08)}
.torii-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c0392b;font-family:sans-serif;font-weight:600}

h1{text-align:center;font-size:1.1rem;font-weight:400;color:#3a2e28;margin-bottom:.25rem;letter-spacing:.05em;padding-top:.5rem}
.subtitle{text-align:center;font-size:.8rem;color:#a08070;margin-bottom:1.25rem}

/* filters */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;flex-wrap:wrap;gap:8px;max-width:640px;margin-left:auto;margin-right:auto}
.filter-group{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid #ccc;background:#fff;color:#888;cursor:pointer;transition:all .15s}
.fbtn.active{background:#c0392b;color:#fff;border-color:transparent}
.shuffle-btn{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid #ccc;background:#fff;color:#555;cursor:pointer}

/* progress */
.prog-wrap{max-width:640px;margin:0 auto .5rem}
.prog-bar-wrap{height:3px;background:#ddd;border-radius:2px;overflow:hidden}
.prog-bar-fill{height:100%;background:#c0392b;border-radius:2px;transition:width .3s}
.prog-text{font-size:11px;color:#aaa;text-align:center;margin-top:4px}

/* main layout */
.exercise{max-width:640px;margin:0 auto}

/* avatar area */
.avatars-row{display:flex;gap:1rem;justify-content:center;margin-bottom:.75rem;flex-wrap:wrap}
.avatar-box{display:flex;flex-direction:column;align-items:center;gap:4px}
.avatar-box svg{width:80px;height:98px}
.avatar-name{font-size:.85rem;font-weight:500;color:#1a1209}
.avatar-country{font-size:.7rem;color:#c0392b}
.avatar-prof{font-size:.7rem;color:#5a7a5a;background:#f0f5f0;padding:1px 7px;border-radius:99px}
.avatar-age{font-size:.7rem;color:#888}

/* object display */
.object-display{
  background:#fff;border:1px solid #e8e0d8;border-radius:12px;
  padding:.75rem 1rem;margin-bottom:.75rem;
  display:flex;align-items:center;gap:1rem;
}
.obj-icon{font-size:2.2rem}
.obj-name{font-size:1.4rem;font-weight:500;color:#222}
.obj-owner-tag{font-size:.75rem;color:#888;font-style:italic}

/* question card */
.q-card{background:#fff;border:1px solid #e8e0d8;border-radius:16px;padding:1.25rem;margin-bottom:.75rem}
.q-type-badge{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#a08070;margin-bottom:.5rem}
.q-text{font-size:1.3rem;font-weight:500;color:#1a1209;margin-bottom:.25rem;line-height:1.5}
.q-hint{font-size:.75rem;color:#c0392b;background:#fdf0ee;padding:3px 10px;border-radius:8px;display:inline-block;margin-top:.3rem}
.q-hint-note{font-size:.72rem;color:#888;font-style:italic;margin-top:.3rem}

/* answer builder */
.answer-builder{margin-bottom:.75rem}
.answer-slots{
  min-height:48px;background:#faf7f2;border:2px dashed #d8d0c8;
  border-radius:12px;padding:.5rem .75rem;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  margin-bottom:.6rem;
}
.answer-slots.has-content{border-style:solid;border-color:#c0392b;background:#fff}
.answer-slots.state-ok{border-color:#2d7a3e;background:#f0faf2}
.answer-slots.state-err{border-color:#c03030;background:#fdf0f0;animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}

.ans-slot{
  font-size:1rem;padding:4px 10px;border-radius:8px;
  background:#c0392b;color:#fff;cursor:pointer;
  border:none;font-family:inherit;
  transition:transform .1s,opacity .15s;
  white-space:nowrap;
}
.ans-slot:hover{opacity:.85;transform:scale(.97)}
.ans-slot.punct{background:#888;padding:4px 6px}
.ans-slot.state-ok{background:#2d7a3e}
.ans-slot.state-err{background:#c03030}

.block-pool{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:.5rem}
.block-btn{
  font-size:1rem;padding:7px 13px;border-radius:10px;
  border:1.5px solid #d8d0c8;background:#fff;color:#222;
  cursor:pointer;font-family:inherit;
  transition:transform .1s,background .15s,opacity .15s;
  white-space:nowrap;
}
.block-btn:hover:not(:disabled){background:#f5ede8;border-color:#c0392b}
.block-btn:active:not(:disabled){transform:scale(.93)}
.block-btn:disabled{opacity:.2;cursor:default}
.block-btn.punct{color:#888;border-color:#e0d8d0}

/* feedback */
.feedback{min-height:22px;font-size:.85rem;font-weight:500;text-align:center;margin-bottom:.5rem}
.feedback.ok{color:#2d7a3e}
.feedback.err{color:#b03030}
.feedback.warn{color:#8a6800}

/* action row */
.action-row{display:flex;gap:8px;justify-content:center;margin-bottom:.5rem;flex-wrap:wrap}
.abtn{font-size:13px;padding:7px 16px;border-radius:10px;border:1px solid #ddd;background:#f7f4f0;color:#333;cursor:pointer;font-weight:500;transition:all .15s;font-family:inherit}
.abtn:hover{background:#ece8e0}
.abtn.retry{background:#fdecea;color:#b03030;border-color:transparent}
.abtn.reveal{background:#fdf6e3;color:#8a6800;border-color:transparent;font-size:12px}
.abtn.es-hint{background:#eef3fd;color:#2255aa;border-color:transparent;font-size:12px}

.es-translation{font-size:.8rem;color:#2255aa;text-align:center;font-style:italic;margin-bottom:.5rem;min-height:18px}

/* nav */
.nav-controls{display:flex;gap:8px;justify-content:center;margin-bottom:.75rem;max-width:640px;margin-left:auto;margin-right:auto}
.nav-btn{font-size:13px;padding:9px 20px;border-radius:10px;border:1px solid #ddd;background:#f7f4f0;color:#333;cursor:pointer;transition:all .15s;font-weight:500;font-family:inherit}
.nav-btn:hover:not(:disabled){background:#ece8e0}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn.primary{background:#c0392b;color:#fff;border-color:transparent}
.nav-btn.primary:hover:not(:disabled){background:#a93226}

/* stats */
.stats-bar{display:flex;gap:8px;justify-content:center;font-size:12px;flex-wrap:wrap;margin-bottom:1rem;max-width:640px;margin-left:auto;margin-right:auto}
.stat{padding:3px 10px;border-radius:99px;background:#f0ebe5;color:#aaa}
.stat.s-ok{color:#2d7a3e}
.stat.s-err{color:#b03030}

/* done */
.done-msg{background:#fff;border:1px solid #e0d8d0;border-radius:16px;padding:2.5rem 1.5rem;text-align:center;max-width:640px;margin:0 auto}
.done-msg h2{font-size:1.3rem;font-weight:500;margin-bottom:8px;color:#222}
.done-msg p{font-size:.9rem;color:#777;margin-bottom:1.5rem}
.done-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* card status badge */
.card-status{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;margin-bottom:.5rem;display:inline-block}
.card-status.ok{background:#e8f5ec;color:#2d7a3e}
.card-status.err{background:#fdecea;color:#b03030}
.card-status.revealed{background:#fdf6e3;color:#8a6800}

/* watermark */
.watermark{
  font-size:11px;font-family:sans-serif;
  color:rgba(0,0,0,.18);letter-spacing:.08em;
  pointer-events:none;
  text-align:center;
  padding:1.5rem 0 .75rem;
  width:100%;
}
@media(min-width:720px){
  .watermark{
    position:fixed;bottom:12px;right:16px;
    padding:0;width:auto;
    text-align:right;
  }
}
</style>
</head>

    <ellipse cx="22" cy="37" rx="14" ry="2.5" fill="rgba(0,0,0,.13)"/>

<h1>じんぶつ 練習</h1>
<p class="subtitle">Personajes y objetos</p>

<div class="top-bar">
  <div class="filter-group">
    <button class="fbtn active" data-q="obj" onclick="toggleQ('obj',this)">Objetos</button>
    <button class="fbtn active" data-q="country" onclick="toggleQ('country',this)">Países</button>

<div class="prog-wrap">

<div class="exercise" id="exercise">

</div>

<div class="nav-controls">

</div>

<div class="stats-bar">

</div>

<div id="doneMsg" class="done-msg" style="display:none">
  <h2>¡Ronda completa! 🎉</h2>
  <p id="doneSummary"></p>

    <button class="nav-btn" onclick="buildDeck()">Repetir todo</button>
    <button class="nav-btn" onclick="goTo(0)">← Revisar desde el inicio</button>
  </div>
</div>

<script>
// ── CHARACTER DATA ─────────────────────────────────────────────────
const CHARS=[
  {nameJP:"ミラ",countryJP:"アメリカ",countryJIN:"アメリカじん",prof:"かいしゃいん",age:28,lang:"えいご",gender:"f",skin:"#f5c5a0",hair:"#4a2800",hairStyle:"short-straight",shirtColor:"#2255aa",shirtStyle:"suit"},
  {nameJP:"マリア",countryJP:"メキシコ",countryJIN:"メキシコじん",prof:"がくせい",age:22,lang:"スペインご",gender:"f",skin:"#e8b080",hair:"#1a0a00",hairStyle:"long-wavy",shirtColor:"#c0392b",shirtStyle:"casual"},
  {nameJP:"スミス",countryJP:"イギリス",countryJIN:"イギリスじん",prof:"せんせい",age:45,lang:"えいご",gender:"m",skin:"#f2d0b0",hair:"#8b6540",hairStyle:"short-side",shirtColor:"#2c3e50",shirtStyle:"teacher"},
  {nameJP:"アミン",countryJP:"インド",countryJIN:"インドじん",prof:"いしゃ",age:38,lang:"ヒンディーご",gender:"m",skin:"#c8906a",hair:"#0a0500",hairStyle:"short-neat",shirtColor:"#ffffff",shirtStyle:"doctor"},
  {nameJP:"サリ",countryJP:"インドネシア",countryJIN:"インドネシアじん",prof:"ぎんこういん",age:31,lang:"インドネシアご",gender:"f",skin:"#d09060",hair:"#0a0500",hairStyle:"hijab",shirtColor:"#16a085",shirtStyle:"suit"},
  {nameJP:"キム",countryJP:"かんこく",countryJIN:"かんこくじん",prof:"けんきゅうしゃ",age:35,lang:"かんこくご",gender:"m",skin:"#f0c898",hair:"#1a1008",hairStyle:"short-neat",shirtColor:"#8e44ad",shirtStyle:"lab"},
  {nameJP:"ナリ",countryJP:"タイ",countryJIN:"タイじん",prof:"がくせい",age:20,lang:"タイご",gender:"f",skin:"#d4905a",hair:"#0a0500",hairStyle:"long-straight",shirtColor:"#e67e22",shirtStyle:"casual"},
  {nameJP:"リン",countryJP:"ちゅうごく",countryJIN:"ちゅうごくじん",prof:"かいしゃいん",age:29,lang:"ちゅうごくご",gender:"f",skin:"#f0c898",hair:"#0a0500",hairStyle:"bun",shirtColor:"#c0392b",shirtStyle:"suit"},
  {nameJP:"ミュラー",countryJP:"ドイツ",countryJIN:"ドイツじん",prof:"けんきゅうしゃ",age:42,lang:"ドイツご",gender:"m",skin:"#f5d5b0",hair:"#c8a060",hairStyle:"short-side",shirtColor:"#27ae60",shirtStyle:"lab"},
  {nameJP:"たなか",countryJP:"にほん",countryJIN:"にほんじん",prof:"せんせい",age:50,lang:"にほんご",gender:"m",skin:"#f0c898",hair:"#1a1008",hairStyle:"short-neat",shirtColor:"#2c3e50",shirtStyle:"teacher"},
  {nameJP:"カルロス",countryJP:"ブラジル",countryJIN:"ブラジルじん",prof:"かいしゃいん",age:33,lang:"ポルトガルご",gender:"m",skin:"#c87840",hair:"#1a0800",hairStyle:"curly",shirtColor:"#27ae60",shirtStyle:"suit"},
  {nameJP:"ソフィー",countryJP:"フランス",countryJIN:"フランスじん",prof:"いしゃ",age:36,lang:"フランスご",gender:"f",skin:"#f5d0b0",hair:"#8b4010",hairStyle:"long-straight",shirtColor:"#ffffff",shirtStyle:"doctor"},
  {nameJP:"ジャック",countryJP:"カナダ",countryJIN:"カナダじん",prof:"ぎんこういん",age:40,lang:"えいご",gender:"m",skin:"#f2d0b0",hair:"#603010",hairStyle:"short-side",shirtColor:"#2980b9",shirtStyle:"suit"},
  {nameJP:"ルカ",countryJP:"イタリア",countryJIN:"イタリアじん",prof:"けんきゅうしゃ",age:39,lang:"イタリアご",gender:"m",skin:"#e8c090",hair:"#2a1000",hairStyle:"short-neat",shirtColor:"#16a085",shirtStyle:"lab"},
  {nameJP:"エレナ",countryJP:"スペイン",countryJIN:"スペインじん",prof:"せんせい",age:44,lang:"スペインご",gender:"f",skin:"#e0b080",hair:"#3a1800",hairStyle:"long-wavy",shirtColor:"#8e44ad",shirtStyle:"teacher"},
  {nameJP:"イワン",countryJP:"ロシア",countryJIN:"ロシアじん",prof:"ぎんこういん",age:37,lang:"ロシアご",gender:"m",skin:"#f5e0c8",hair:"#a08060",hairStyle:"short-side",shirtColor:"#2c3e50",shirtStyle:"suit"},
  {nameJP:"ファリダ",countryJP:"エジプト",countryJIN:"エジプトじん",prof:"いしゃ",age:34,lang:"アラビアご",gender:"f",skin:"#c88858",hair:"#0a0500",hairStyle:"hijab",shirtColor:"#ffffff",shirtStyle:"doctor"},
  {nameJP:"アミラ",countryJP:"タンザニア",countryJIN:"タンザニアじん",prof:"がくせい",age:21,lang:"スワヒリご",gender:"f",skin:"#7a4820",hair:"#0a0500",hairStyle:"natural",shirtColor:"#e67e22",shirtStyle:"casual"},
  {nameJP:"ロドリゴ",countryJP:"アルゼンチン",countryJIN:"アルゼンチンじん",prof:"かいしゃいん",age:30,lang:"スペインご",gender:"m",skin:"#e8c090",hair:"#1a0800",hairStyle:"short-neat",shirtColor:"#2980b9",shirtStyle:"suit"},
  {nameJP:"サクラ",countryJP:"にほん",countryJIN:"にほんじん",prof:"がくせい",age:19,lang:"にほんご",gender:"f",skin:"#f5d0b0",hair:"#0a0500",hairStyle:"long-straight",shirtColor:"#e91e8c",shirtStyle:"casual"},
];

const OBJECTS=["ほん","じしょ","ざっし","しんぶん","ノート","てちょう","めいし","カード","えんぴつ","ボールペン","ペン","かぎ","とけい","かさ","かばん","イヤホン","テレビ","カメラ","パソコン","スマホ"];

const OBJ_ICONS={"ほん":"📗","じしょ":"📘","ざっし":"📰","しんぶん":"📄","ノート":"📓","てちょう":"📅","めいし":"🪪","カード":"💳","えんぴつ":"✏️","ボールペン":"🖊️","ペン":"🖋️","かぎ":"🔑","とけい":"⌚","かさ":"☂️","かばん":"👜","イヤホン":"🎧","テレビ":"📺","カメラ":"📷","パソコン":"💻","スマホ":"📱"};

const PROF_ES={"かいしゃいん":"empleado de empresa","がくせい":"estudiante","せんせい":"maestro/a","いしゃ":"médico/a","ぎんこういん":"empleado de banco","けんきゅうしゃ":"investigador/a"};
const COUNTRY_ES={"アメリカじん":"americano/a","メキシコじん":"mexicano/a","イギリスじん":"británico/a","インドじん":"indio/a","インドネシアじん":"indonesio/a","かんこくじん":"coreano/a","タイじん":"tailandés/a","ちゅうごくじん":"chino/a","ドイツじん":"alemán/a","にほんじん":"japonés/a","ブラジルじん":"brasileño/a","フランスじん":"francés/a","カナダじん":"canadiense","イタリアじん":"italiano/a","スペインじん":"español/a","ロシアじん":"ruso/a","エジプトじん":"egipcio/a","タンザニアじん":"tanzano/a","アルゼンチンじん":"argentino/a"};

// Assign objects to chars deterministically
const OBJ_OWNERS={};
(()=>{
  let shuffled=[...OBJECTS];
  // simple deterministic shuffle
  for(let i=shuffled.length-1;i>0;i--){const j=(i*7+3)%shuffled.length;[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
  shuffled.forEach((o,i)=>{OBJ_OWNERS[o]=CHARS[i%CHARS.length].nameJP;});
})();

// ── AGE TO HIRAGANA ───────────────────────────────────────────────
function ageToHira(n){
  const ones=["","いち","に","さん","よん","ご","ろく","なな","はち","きゅう"];
  if(n<10) return [ones[n]];
  if(n===10) return ["じゅう"];
  const t=Math.floor(n/10), o=n%10;
  const r=t===1?["じゅう"]:[ones[t],"じゅう"];
  if(o) r.push(ones[o]);
  return r;
}

// ── QUESTION GENERATOR ────────────────────────────────────────────
function genQuestions(){
  const qs=[];
  const otherChars=(c)=>CHARS.filter(x=>x.nameJP!==c.nameJP);
  const otherCountries=(c)=>CHARS.filter(x=>x.countryJIN!==c.countryJIN).map(x=>x.countryJIN);
  const otherProfs=(c)=>CHARS.filter(x=>x.prof!==c.prof).map(x=>x.prof);
  const otherObjs=(o)=>OBJECTS.filter(x=>x!==o);
  const rand=(arr)=>arr[Math.floor(Math.random()*arr.length)];
  const randN=(arr,n)=>{const s=[...arr];for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]];}return s.slice(0,n);};

  CHARS.forEach(c=>{
    const san=c.nameJP+"さん";
    const wrongChar=rand(otherChars(c));
    const wrongSan=wrongChar.nameJP+"さん";

    // ── TYPE 1a: closed object ────────────────────────────────────
    if(activeQTypes.has('obj')){
      const obj=rand(OBJECTS);
      const wrongObj=rand(otherObjs(obj));
      // positive (これはXですか → yes)
      qs.push({
        type:'obj_closed', subtype:'pos',
        charIdx:CHARS.indexOf(c),
        objDisplay:obj,
        q:`これは　${obj}　ですか？`,
        qES:`¿Esto es un(a) ${obj}?`,
        hint:null, hintNote:null,
        answer:["はい","、","そうです","。"],
        distractors:["いいえ","ちがいます","これ","は",wrongObj,"では","ありません"],
        showChar:false,
      });
      // negative (これはXですか → no, it's Y)
      qs.push({
        type:'obj_closed', subtype:'neg',
        charIdx:CHARS.indexOf(c),
        objDisplay:wrongObj,
        q:`これは　${wrongObj}　ですか？`,
        qES:`¿Esto es un(a) ${wrongObj}?`,
        hint:null, hintNote:null,
        answer:["いいえ","、","これ","は",wrongObj,"では","ありません","。","これ","は",obj,"です","。"],
        distractors:["はい","そうです","それ","の",obj,wrongObj,"じゃ"],
        showChar:false,
        objDisplay2:obj,
      });
    }

    // ── TYPE 1b: open object ──────────────────────────────────────
    if(activeQTypes.has('obj')){
      const obj=rand(OBJECTS);
      const wrongObj=rand(otherObjs(obj));
      qs.push({
        type:'obj_open',
        charIdx:CHARS.indexOf(c),
        objDisplay:obj,
        q:`これは　なんですか？`,
        qES:`¿Qué es esto?`,
        hint:null, hintNote:null,
        answer:["これ","は",obj,"です","。"],
        distractors:["それ","の",wrongObj,"そうです","では","ありません"],
        showChar:false,
      });
    }

    // ── TYPE 2a: closed country ───────────────────────────────────
    if(activeQTypes.has('country')){
      const wrongC=rand(otherCountries(c));
      // positive
      qs.push({
        type:'country_closed', subtype:'pos',
        charIdx:CHARS.indexOf(c),
        q:`${san}は　${c.countryJIN}　ですか？`,
        qES:`¿Es ${san} ${COUNTRY_ES[c.countryJIN]||c.countryJIN}?`,
        hint:null, hintNote:null,
        answer:["はい","、","そうです","。"],
        distractors:["いいえ","ちがいます",san,"は",c.countryJIN,wrongC,"では","ありません"],
        showChar:true,
      });
      // negative (wrong country in question)
      qs.push({
        type:'country_closed', subtype:'neg',
        charIdx:CHARS.indexOf(c),
        q:`${san}は　${wrongC}　ですか？`,
        qES:`¿Es ${san} ${COUNTRY_ES[wrongC]||wrongC}?`,
        hint:null, hintNote:null,
        answer:["いいえ","、",san,"は",wrongC,"では","ありません","。",san,"は",c.countryJIN,"です","。"],
        distractors:["はい","そうです","の",c.countryJIN,wrongC,"じゃ","ちがいます"],
        showChar:true,
      });
    }

    // ── TYPE 2b: open country ─────────────────────────────────────
    if(activeQTypes.has('country')){
      qs.push({
        type:'country_open',
        charIdx:CHARS.indexOf(c),
        q:`${san}は　どこのひとですか？`,
        qES:`¿De dónde es ${san}?`,
        hint:null, hintNote:null,
        answer:[san,"は",c.countryJIN,"です","。"],
        distractors:["これ","は","の",rand(otherCountries(c)),"そうです","では"],
        showChar:true,
      });
    }

    // ── TYPE 3a: closed profession ────────────────────────────────
    if(activeQTypes.has('prof')){
      const wrongP=rand(otherProfs(c));
      qs.push({
        type:'prof_closed', subtype:'pos',
        charIdx:CHARS.indexOf(c),
        q:`${san}は　${c.prof}　ですか？`,
        qES:`¿Es ${san} ${PROF_ES[c.prof]||c.prof}?`,
        hint:null, hintNote:null,
        answer:["はい","、","そうです","。"],
        distractors:["いいえ","ちがいます",san,"は",c.prof,wrongP,"では","ありません"],
        showChar:true,
      });
      qs.push({
        type:'prof_closed', subtype:'neg',
        charIdx:CHARS.indexOf(c),
        q:`${san}は　${wrongP}　ですか？`,
        qES:`¿Es ${san} ${PROF_ES[wrongP]||wrongP}?`,
        hint:null, hintNote:null,
        answer:["いいえ","、",san,"は",wrongP,"では","ありません","。",san,"は",c.prof,"です","。"],
        distractors:["はい","そうです","の",c.prof,wrongP,"じゃ"],
        showChar:true,
      });
    }

    // ── TYPE 3b: open profession ──────────────────────────────────
    if(activeQTypes.has('prof')){
      qs.push({
        type:'prof_open',
        charIdx:CHARS.indexOf(c),
        q:`${san}は　なんですか？`,
        qES:`¿Qué es ${san}? (ocupación)`,
        hint:"（しごと・ocupación）",
        hintNote:null,
        answer:[san,"は",c.prof,"です","。"],
        distractors:["これ","は","の",rand(otherProfs(c)),"そうです","では"],
        showChar:true,
      });
    }

    // ── TYPE 4a: closed age ───────────────────────────────────────
    if(activeQTypes.has('age')){
      const ageToks=ageToHira(c.age);
      const wrongAge=rand(otherChars(c)).age;
      const wrongAgeToks=ageToHira(wrongAge);
      qs.push({
        type:'age_closed', subtype:'pos',
        charIdx:CHARS.indexOf(c),
        q:`${san}は　${c.age}さい　ですか？`,
        qES:`¿Tiene ${san} ${c.age} años?`,
        hint:null, hintNote:null,
        answer:["はい","、","そうです","。"],
        distractors:["いいえ","ちがいます",san,"は",...ageToks,"さい",...wrongAgeToks,"では","ありません"],
        showChar:true,
      });
      qs.push({
        type:'age_closed', subtype:'neg',
        charIdx:CHARS.indexOf(c),
        q:`${san}は　${wrongAge}さい　ですか？`,
        qES:`¿Tiene ${san} ${wrongAge} años?`,
        hint:null, hintNote:null,
        answer:["いいえ","、",san,"は",...wrongAgeToks,"さい","では","ありません","。",san,"は",...ageToks,"さい","です","。"],
        distractors:["はい","そうです","の",...ageToks,...wrongAgeToks,"じゃ"],
        showChar:true,
      });
    }

    // ── TYPE 4b: open age ─────────────────────────────────────────
    if(activeQTypes.has('age')){
      const ageToks=ageToHira(c.age);
      qs.push({
        type:'age_open',
        charIdx:CHARS.indexOf(c),
        q:`${san}は　なんさいですか？`,
        qES:`¿Cuántos años tiene ${san}?`,
        hint:null, hintNote:null,
        answer:[san,"は",...ageToks,"さい","です","。"],
        distractors:["これ","は","の","そうです","では",...ageToHira(rand(otherChars(c)).age)],
        showChar:true,
      });
    }

    // ── TYPE 5a: closed possession ────────────────────────────────
    if(activeQTypes.has('possess')){
      // find an object that belongs to this char
      const myObjs=OBJECTS.filter(o=>OBJ_OWNERS[o]===c.nameJP);
      if(myObjs.length>0){
        const obj=rand(myObjs);
        const wrongOwnerChar=rand(otherChars(c));
        const wrongSan2=wrongOwnerChar.nameJP+"さん";
        // positive
        qs.push({
          type:'possess_closed', subtype:'pos',
          charIdx:CHARS.indexOf(c),
          charIdx2:CHARS.indexOf(c),
          objDisplay:obj,
          q:`これは　${san}の　${obj}　ですか？`,
          qES:`¿Es este(a) ${obj} de ${san}?`,
          hint:null,
          hintNote:"💡 これ → それ　al responder",
          answer:["はい","、","そうです","。"],
          distractors:["いいえ","ちがいます","それ","は",san,"の",obj,"では","ありません",wrongSan2,"の"],
          showChar:true,
        });
        // negative: ask with wrong owner
        qs.push({
          type:'possess_closed', subtype:'neg',
          charIdx:CHARS.indexOf(wrongOwnerChar),
          charIdx2:CHARS.indexOf(c),
          objDisplay:obj,
          q:`これは　${wrongSan2}の　${obj}　ですか？`,
          qES:`¿Es este(a) ${obj} de ${wrongSan2}?`,
          hint:null,
          hintNote:"💡 これ → それ　al responder",
          answer:["いいえ","、","それ","は",wrongSan2,"の",obj,"では","ありません","。","それ","は",san,"の",obj,"です","。"],
          distractors:["はい","そうです","これ","の","の",san,wrongSan2,obj,"じゃ"],
          showChar:true,
        });
      }
    }

    // ── TYPE 5b: open possession ──────────────────────────────────
    if(activeQTypes.has('possess')){
      const myObjs=OBJECTS.filter(o=>OBJ_OWNERS[o]===c.nameJP);
      if(myObjs.length>0){
        const obj=rand(myObjs);
        qs.push({
          type:'possess_open',
          charIdx:CHARS.indexOf(c),
          charIdx2:CHARS.indexOf(c),
          objDisplay:obj,
          q:`これは　だれの　${obj}　ですか？`,
          qES:`¿De quién es este(a) ${obj}?`,
          hint:null,
          hintNote:"💡 これ → それ　al responder",
          answer:["それ","は",san,"の",obj,"です","。"],
          distractors:["これ","は","の",rand(otherChars(c)).nameJP+"さん","そうです","では","ありません"],
          showChar:true,
        });
      }
    }
  });
  return qs;
}

// ── STATE ─────────────────────────────────────────────────────────
let deck=[],idx=0,cardStates=[];
let activeQTypes=new Set(['obj','country','prof','age','possess']);
let esVisible=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

function buildDeck(){
  let qs=genQuestions();
  shuffle(qs);
  deck=qs;
  cardStates=new Array(deck.length).fill(null);
  idx=0;esVisible=false;
  document.getElementById('doneMsg').style.display='none';
  document.getElementById('exercise').style.display='block';
  document.querySelector('.nav-controls').style.display='flex';
  render();updateStats();
}

function toggleQ(type,btn){
  if(activeQTypes.has(type)){if(activeQTypes.size===1)return;activeQTypes.delete(type);btn.classList.remove('active');}
  else{activeQTypes.add(type);btn.classList.add('active');}
  buildDeck();
}

function initState(i){
  if(!cardStates[i]){
    const q=deck[i];
    const pool=makeBlockPool(q);
    cardStates[i]={phase:'input',answer:[],buttons:pool,hadError:false};
  }
}

function makeBlockPool(q){
  // correct tokens (unique, preserving needed repeats)
  const needed=[...q.answer];
  // distractors — pick up to fill to ~10 total unique additions
  const usedSet=new Set(needed);
  const extras=q.distractors.filter(d=>!usedSet.has(d));
  const all=[...needed,...extras];
  shuffle(all);
  return all;
}

// ── NAVIGATION ────────────────────────────────────────────────────
function goTo(i){
  if(i<0||i>=deck.length)return;
  idx=i;esVisible=false;
  document.getElementById('doneMsg').style.display='none';
  document.getElementById('exercise').style.display='block';
  document.querySelector('.nav-controls').style.display='flex';
  render();
}
function goNext(){
  if(idx===deck.length-1){showDone();return;}
  idx++;esVisible=false;render();
}

// ── RENDER ────────────────────────────────────────────────────────
function render(){
  initState(idx);
  const q=deck[idx],st=cardStates[idx];

  // avatars
  renderAvatars(q);

  // object area
  const objArea=document.getElementById('objectArea');
  if(q.objDisplay){
    const icon=OBJ_ICONS[q.objDisplay]||'📦';
    objArea.innerHTML=`<div class="object-display">
      <span class="obj-icon">${icon}</span>
      <div><div class="obj-name">${q.objDisplay}</div></div>
    </div>`;
  } else { objArea.innerHTML=''; }

  // question
  const qTypeLabels={obj_closed:'はい・いいえ',obj_open:'なに',country_closed:'はい・いいえ',country_open:'どこ',prof_closed:'はい・いいえ',prof_open:'なに',age_closed:'はい・いいえ',age_open:'なんさい',possess_closed:'はい・いいえ',possess_open:'だれ'};
  document.getElementById('qTypeBadge').textContent=qTypeLabels[q.type]||q.type;
  document.getElementById('qText').textContent=q.q;

  // status badge
  const badge=document.getElementById('cardStatusBadge');
  const labels={input:'',wrong:'✗ Incorrecto',correct:'✓ Correcto',revealed:'👁 Revelada'};
  const cls={input:'',wrong:'err',correct:'ok',revealed:'revealed'};
  badge.textContent=labels[st.phase];
  badge.className='card-status'+(cls[st.phase]?' '+cls[st.phase]:'');

  // hint
  const hintEl=document.getElementById('qHint');
  if(q.hint) {hintEl.innerHTML=`<span class="q-hint">${q.hint}</span>`;hintEl.style.display='';}
  else hintEl.innerHTML='';
  const hintNoteEl=document.getElementById('qHintNote');
  if(q.hintNote){hintNoteEl.innerHTML=`<div class="q-hint-note">${q.hintNote}</div>`;hintNoteEl.style.display='';}
  else hintNoteEl.innerHTML='';

  // ES translation
  const esEl=document.getElementById('esTranslation');
  esEl.textContent=esVisible?(q.qES||''):'';

  // progress
  const pct=Math.round((idx/(deck.length-1||1))*100);
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progText').textContent=(idx+1)+' / '+deck.length;

  renderSlots();
  setFeedback('','');
  renderActions();
  renderBlocks();

  document.getElementById('btnPrev').disabled=(idx===0);
  const done=st.phase!=='input';
  const nextBtn=document.getElementById('btnNext');
  nextBtn.disabled=!done;
  nextBtn.className='nav-btn'+(done?' primary':'');
  nextBtn.textContent=(idx===deck.length-1&&done)?'Ver resultados →':'Siguiente →';
}

function renderAvatars(q){
  const row=document.getElementById('avatarsRow');
  row.innerHTML='';
  const idxs=new Set();
  if(q.charIdx!==undefined) idxs.add(q.charIdx);
  if(q.charIdx2!==undefined) idxs.add(q.charIdx2);
  if(idxs.size===0) return;
  idxs.forEach(ci=>{
    const c=CHARS[ci];
    const box=document.createElement('div');
    box.className='avatar-box';
    box.innerHTML=makeAvatar(c,80)+
      `<div class="avatar-name">${c.nameJP}さん</div>
       <div class="avatar-country">${c.countryJP}</div>
       <div class="avatar-prof">${c.prof}</div>
       <div class="avatar-age">${c.age}さい</div>`;
    row.appendChild(box);
  });
}

function renderSlots(){
  const container=document.getElementById('answerSlots');
  container.innerHTML='';
  const st=cardStates[idx];
  if(st.answer.length===0){container.className='answer-slots';return;}
  container.className='answer-slots has-content'+(st.phase==='correct'?' state-ok':st.phase==='wrong'?' state-err':'');
  st.answer.forEach((tok,i)=>{
    const btn=document.createElement('button');
    const isPunct=tok==='、'||tok==='。';
    btn.className='ans-slot'+(isPunct?' punct':'')+(st.phase==='correct'?' state-ok':st.phase==='wrong'?' state-err':'');
    btn.textContent=tok;
    if(st.phase==='input') btn.onclick=()=>removeSlotAt(i);
    else btn.onclick=null;
    container.appendChild(btn);
  });
}

function renderActions(){
  const row=document.getElementById('actionRow');
  row.innerHTML='';
  const st=cardStates[idx];
  const q=deck[idx];

  // ES toggle always
  const esBtn=document.createElement('button');
  esBtn.className='abtn es-hint';
  esBtn.textContent=esVisible?'🇯🇵 japonés':'🇪🇸 español';
  esBtn.onclick=()=>{esVisible=!esVisible;document.getElementById('esTranslation').textContent=esVisible?(q.qES||''):'';esBtn.textContent=esVisible?'🇯🇵 japonés':'🇪🇸 español';};
  row.appendChild(esBtn);

  if(st.phase==='input'){
    const revBtn=document.createElement('button');
    revBtn.className='abtn reveal';revBtn.textContent='👁 Ver respuesta';
    revBtn.onclick=revealAnswer;row.appendChild(revBtn);
  } else if(st.phase==='wrong'){
    setFeedback('Incorrecto — ¿intentas de nuevo?','err');
    const retry=document.createElement('button');
    retry.className='abtn retry';retry.textContent='↺ Reintentar';
    retry.onclick=retryCard;row.appendChild(retry);
  } else if(st.phase==='correct'){
    setFeedback(st.hadError?'¡Correcto! (con reintento)':'¡Perfecto! ✓','ok');
  } else if(st.phase==='revealed'){
    setFeedback('Respuesta revelada','warn');
  }
}

function renderBlocks(){
  const pool=document.getElementById('blockPool');
  pool.innerHTML='';
  const st=cardStates[idx];
  const locked=st.phase!=='input';
  const usedIdx=getUsed(st.answer,st.buttons);
  st.buttons.forEach((k,i)=>{
    const btn=document.createElement('button');
    btn.className='block-btn'+(k==='、'||k==='。'?' punct':'');
    btn.textContent=k;btn.disabled=locked||usedIdx.has(i);
    btn.onclick=locked?null:()=>handleBlock(k,i);
    pool.appendChild(btn);
  });
}

function getUsed(answer,buttons){
  const used=new Set();
  for(const t of answer){
    for(let i=0;i<buttons.length;i++){
      if(buttons[i]===t&&!used.has(i)){used.add(i);break;}
    }
  }
  return used;
}

// ── INTERACTION ───────────────────────────────────────────────────
function handleBlock(k,btnIdx){
  const st=cardStates[idx];
  if(st.phase!=='input')return;
  const q=deck[idx];
  const pos=st.answer.length;
  if(pos>=q.answer.length)return;

  st.answer.push(k);
  document.querySelectorAll('#blockPool .block-btn')[btnIdx].disabled=true;
  renderSlots();
  setFeedback('','');

  if(st.answer.length===q.answer.length) setTimeout(verifyAnswer,120);
}

function verifyAnswer(){
  const st=cardStates[idx];
  const q=deck[idx];
  const correct=st.answer.every((k,i)=>k===q.answer[i]);
  st.phase=correct?'correct':'wrong';
  if(!correct)st.hadError=true;
  updateStats();
  render();
  if(!correct){
    const slots=document.getElementById('answerSlots');
    slots.classList.remove('state-err');void slots.offsetWidth;slots.classList.add('state-err');
  }
}

function retryCard(){
  cardStates[idx].phase='input';
  cardStates[idx].answer=[];
  render();setFeedback('','');
}

function revealAnswer(){
  const st=cardStates[idx];
  st.answer=[...deck[idx].answer];
  st.phase='revealed';
  updateStats();render();
}

function removeSlotAt(pos){
  const st=cardStates[idx];
  if(st.phase!=='input')return;
  const token=st.answer[pos];
  const usedBefore=getUsed(st.answer.slice(0,pos),st.buttons);
  for(let i=0;i<st.buttons.length;i++){
    if(st.buttons[i]===token&&!usedBefore.has(i)){
      const btns=document.querySelectorAll('#blockPool .block-btn');
      if(btns[i])btns[i].disabled=false;
      break;
    }
  }
  st.answer.splice(pos,1);
  renderSlots();renderBlocks();setFeedback('','');
}

// ── STATS ─────────────────────────────────────────────────────────
function updateStats(){
  let ok=0,err=0,rev=0,blank=0;
  for(const s of cardStates){
    if(!s||s.phase==='input')blank++;
    else if(s.phase==='correct'&&!s.hadError)ok++;
    else if(s.phase==='correct'&&s.hadError)err++;
    else if(s.phase==='wrong')err++;
    else if(s.phase==='revealed')rev++;
  }
  document.getElementById('statTotal').textContent='Total: '+deck.length;
  document.getElementById('statOk').textContent='✓ '+ok;
  document.getElementById('statErr').textContent='✗ '+(err+rev);
  document.getElementById('statBlank').textContent='— '+blank;
}

function setFeedback(msg,type){
  const el=document.getElementById('feedback');
  el.textContent=msg;el.className='feedback'+(type?' '+type:'');
}

function showDone(){
  document.getElementById('exercise').style.display='none';
  document.querySelector('.nav-controls').style.display='none';
  document.getElementById('doneMsg').style.display='block';
  let ok=0,err=0,rev=0;
  for(const s of cardStates){
    if(!s||s.phase==='input')continue;
    if(s.phase==='correct'&&!s.hadError)ok++;
    else if(s.phase==='correct'&&s.hadError)err++;
    else if(s.phase==='wrong')err++;
    else if(s.phase==='revealed')rev++;
  }
  document.getElementById('doneSummary').textContent=
    '✓ '+ok+' perfectas · ✗ '+err+' con errores · 👁 '+rev+' reveladas.';
}

buildDeck();
</script>
