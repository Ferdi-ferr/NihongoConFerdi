<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:#f5f5f0;min-height:100vh;padding:1.5rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}

.torii-home{position:fixed;top:14px;left:14px;z-index:999;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.85;transition:opacity .2s,transform .2s}
.torii-home:hover{opacity:1;transform:scale(1.08)}
.torii-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c0392b;font-family:sans-serif;font-weight:600}

h1{font-size:15px;font-weight:600;color:#555;margin:.5rem 0 .25rem;text-align:center;letter-spacing:.03em}
.subtitle{font-size:.8rem;color:#a08070;margin-bottom:1.25rem;text-align:center;font-style:italic}

.wrap{width:100%;max-width:1100px}

/* controles */
.search-input{width:100%;font-size:.95rem;padding:9px 14px;border-radius:10px;border:1.5px solid #e0d8d0;background:#fff;outline:none;font-family:inherit;transition:border-color .15s}
.search-input:focus{border-color:#3b72d4}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin:.8rem 0 .6rem}
.seg{display:flex;gap:4px;background:#fff;border:1px solid #e0d8d0;border-radius:99px;padding:3px}
.seg button{font:500 12px 'Noto Sans JP',sans-serif;padding:5px 13px;border-radius:99px;border:none;background:transparent;color:#888;cursor:pointer;transition:all .2s}
.seg button.active{background:#3b72d4;color:#fff}
.study-btn{font:500 12px 'Noto Sans JP',sans-serif;padding:6px 14px;border-radius:99px;border:1px solid #e0d8d0;background:#fff;color:#888;cursor:pointer;transition:all .2s}
.study-btn.active{background:#c0392b;border-color:#c0392b;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.7rem}
.chip{font:500 12px 'Noto Sans JP',sans-serif;padding:5px 12px;border-radius:99px;border:1px solid #e0d8d0;background:#fff;color:#777;cursor:pointer;transition:all .15s}
.chip:hover{background:#f0f0eb}
.chip.active{background:#eef3ff;border-color:#3b72d4;color:#3b72d4}
.chip small{opacity:.6;margin-left:3px;font-size:10px}
.count{font-size:.75rem;color:#aaa;margin:.2rem 0 .7rem}

/* estudio: oculta hasta tocar */
.study .hide{filter:blur(7px);cursor:pointer;user-select:none;transition:filter .2s}
.study .hide.rev{filter:none;user-select:auto}

/* LISTA */
.list{background:#fff;border:1px solid #e0d8d0;border-radius:18px;overflow:hidden}
.krow{border-bottom:1px solid #f0ede8}
.krow:last-child{border-bottom:none}
.k-top{display:grid;grid-template-columns:34px 64px 1fr auto 28px;gap:0 12px;align-items:center;padding:10px 14px;cursor:pointer}
.k-top:hover{background:#fafaf7}
.k-n{font-size:.7rem;color:#bbb;text-align:center}
.k-char{font-size:2.3rem;line-height:1.1;color:#1a1209;text-align:center}
.k-mean{font-size:.88rem;color:#c0392b;font-weight:500;line-height:1.4}
.k-read{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:2px;font-size:.85rem}
.k-read .lab{font-size:.62rem;font-weight:700;letter-spacing:.08em;color:#aaa;margin-right:5px}
.k-read .on{color:#2255aa}.k-read .kun{color:#2d7a3e}
.k-meta{font-size:.72rem;color:#aaa;text-align:right;white-space:nowrap;line-height:1.5}
.k-arrow{color:#bbb;font-size:.8rem;transition:transform .2s;text-align:center}
.krow.open .k-arrow{transform:rotate(180deg)}
.k-more{display:none;padding:2px 14px 14px 124px}
.krow.open .k-more{display:block}

/* bloque extra (palabras, oración) */
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px}
.h{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#c0392b;margin-bottom:4px}
.w-row{display:grid;grid-template-columns:minmax(3.2rem,auto) minmax(4.4rem,auto) 1fr;gap:0 .8rem;align-items:baseline;padding:2px 0}
.w-row .w{font-size:1.05rem;font-weight:500;color:#1a1209}
.w-row .r{font-size:.8rem;color:#3b72d4}
.w-row .m{font-size:.78rem;color:#888}
.sent .jp{font-size:1rem;color:#1a1209;line-height:1.6}
.sent .es{font-size:.8rem;color:#888}
.rad{display:flex;align-items:baseline;gap:.5rem;margin-bottom:10px}
.rad .rc{font-size:1.5rem;color:#1a1209;line-height:1}
.rad .rn{font-size:.82rem;color:#2d7a3e}
.practice{display:inline-block;margin-top:8px;font-size:.75rem;color:#3b72d4;text-decoration:none;border:1px solid #cfdcf6;background:#eef3ff;border-radius:99px;padding:3px 12px}
.practice:hover{background:#dfe9fb}

/* FICHAS */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.kcard .more-grid{grid-template-columns:1fr;gap:12px}
.kcard .w-row{grid-template-columns:minmax(3.6rem,auto) minmax(4.6rem,auto) 1fr}
.kcard{background:#fff;border:1px solid #e0d8d0;border-radius:18px;padding:16px 18px;position:relative}
.kc-head{display:flex;gap:14px;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #f0ede8}
.kc-char{font-size:3.6rem;line-height:1;color:#1a1209}
.kc-n{position:absolute;top:10px;right:14px;font-size:.7rem;color:#bbb}
.kc-meta{font-size:.72rem;color:#aaa;margin-top:3px}
.kcard .k-mean{margin-bottom:2px}
.kcard .rad{margin:10px 0 8px}

.empty{background:#fff;border:1px solid #e0d8d0;border-radius:16px;padding:1.5rem;text-align:center;color:#aaa;font-style:italic;font-size:.85rem}

@media(max-width:640px){
  .k-top{grid-template-columns:28px 52px 1fr 26px}
  .k-meta{display:none}
  .k-char{font-size:2rem}
  .k-more{padding:2px 14px 14px 14px}
  .more-grid{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  body{padding-top:4.2rem}
}
</style>

{"c":"九","n":9,"g":"Números","on":["ク","キュウ"],"kun":["ここの(つ)"],"m":["nueve","noveno"],"s":2,"rad":["乙","おつ"],"w":[["九つ","ここのつ","nueve (cosas)"],["九月","くがつ","septiembre"],["九時","くじ","las nueve"]],"t":["九時に 会社へ 行きます。","Voy a la empresa a las nueve."]},
{"c":"十","n":10,"g":"Números","on":["ジュウ","ジッ"],"kun":["とお","と"],"m":["diez","décimo","diez unidades"],"s":2,"rad":["十","じゅう"],"w":[["十","とお","diez (cosas)"],["十月","じゅうがつ","octubre"],["十分","じゅっぷん","diez minutos"]],"t":["十月に 来ます。","Vengo en octubre."]}];

const GROUPS=['Todos','Números','Tiempo','Días y elementos','Gente','Escuela y trabajo','Acciones','Otros'];
const st={q:'',g:'Todos',view:'list',sort:'class',study:false,open:new Set()};

const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const noAcc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const kataToHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const cleanKana=s=>kataToHira(s).replace(/[()（）.\-\s/／]/g,'');
const hasW=typeof wanakana!=='undefined';

// índice de búsqueda por kanji
KANJI.forEach(k=>{
  k._es=noAcc(k.m.join(' | ')+' | '+k.w.map(w=>w[2]).join(' | ')+' | '+k.t[1]);
  k._kana=[...k.on,...k.kun].map(cleanKana).concat(k.w.map(w=>cleanKana(w[1].replace(/\s*\/\s*/g,'|')))).join('|');
  k._jp=k.c+k.w.map(w=>w[0]).join('')+k.t[0];
});

function matches(k,raw){
  const q=raw.trim();
  if(!q) return true;
  if(/[㐀-鿿]/.test(q)) return k._jp.includes(q);             // kanji
  const nq=noAcc(q);
  let ok=nq.length>=2 && k._es.includes(nq);                           // español
  const kq=hasW?cleanKana(wanakana.toHiragana(q)):'';
  if(!ok && kq && /[぀-ゟ]/.test(kq) && (kq.length>=2||/[぀-ゟ]/.test(q))){
    ok=k._kana.includes(kq);                                           // lectura (romaji o kana)
  }
  return ok;
}

function list(){
  let a=KANJI.filter(k=>(st.g==='Todos'||k.g===st.g)&&matches(k,st.q));
  if(st.sort==='strokes') a.sort((x,y)=>x.s-y.s||((x.n||99)-(y.n||99)));
  else a.sort((x,y)=>(x.n||99)-(y.n||99));
  return a;
}

function wordsHtml(k){
  return k.w.map(w=>`<div class="w-row"><span class="w">${esc(w[0])}</span><span class="r hide">${esc(w[1])}</span><span class="m hide">${esc(w[2])}</span></div>`).join('');
}
function moreHtml(k){
  return `<div class="more-grid">
    <div>
      <div class="h">Radical</div>
      <div class="rad"><span class="rc">${esc(k.rad[0])}</span><span class="rn">${esc(k.rad[1])}</span></div>
      <div class="h">Oración</div>
      <div class="sent"><div class="jp">${esc(k.t[0])}</div><div class="es hide">${esc(k.t[1])}</div></div>
      <a class="practice" href="kanji_draw.html?k=${encodeURIComponent(k.c)}">✍ Practicar escritura</a>
    </div>
    <div><div class="h">Palabras útiles</div>${wordsHtml(k)}</div>
  </div>`;
}
const readHtml=k=>`<div class="k-read">
  <span class="hide"><span class="lab">ON</span><span class="on">${esc(k.on.join('、')||'—')}</span></span>
  <span class="hide"><span class="lab">KUN</span><span class="kun">${esc(k.kun.join('、')||'—')}</span></span></div>`;

function render(){
  const a=list();
  document.getElementById('count').textContent=a.length+(a.length===1?' kanji':' kanjis');
  const out=document.getElementById('out');
  out.className=st.study?'study':'';
  if(!a.length){out.innerHTML='<div class="empty">No encontré ningún kanji con eso.</div>';return;}
  if(st.view==='list'){
    out.innerHTML='<div class="list">'+a.map(k=>`
      <div class="krow${st.open.has(k.c)?' open':''}" data-c="${k.c}">
        <div class="k-top">
          <div class="k-n">${k.n||''}</div>
          <div class="k-char">${k.c}</div>
          <div><div class="k-mean hide">${esc(k.m.join(' · '))}</div>${readHtml(k)}</div>
          <div class="k-meta">${k.s} trazos<br>${esc(k.rad[0])} ${esc(k.rad[1])}</div>
          <div class="k-arrow">▾</div>
        </div>
        <div class="k-more">${moreHtml(k)}</div>
      </div>`).join('')+'</div>';
  }else{
    out.innerHTML='<div class="cards">'+a.map(k=>`
      <div class="kcard">
        <span class="kc-n">${k.n?'#'+k.n:''}</span>
        <div class="kc-head"><div class="kc-char">${k.c}</div>
          <div><div class="k-mean hide">${esc(k.m.join(' · '))}</div>${readHtml(k)}<div class="kc-meta">${k.s} trazos</div></div></div>
        ${moreHtml(k)}
      </div>`).join('')+'</div>';
  }
}

function renderChips(){
  const el=document.getElementById('chips');
  el.innerHTML=GROUPS.map(g=>{
    const n=g==='Todos'?KANJI.length:KANJI.filter(k=>k.g===g).length;
    return `<button class="chip${st.g===g?' active':''}" data-g="${g}">${g}<small>${n}</small></button>`;
  }).join('');
}

document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value;render();});
document.getElementById('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;st.g=b.dataset.g;renderChips();render();});
document.getElementById('viewSeg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;st.view=b.dataset.v;
  document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.toggle('active',x===b));render();});
document.getElementById('sortSeg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;st.sort=b.dataset.s;
  document.querySelectorAll('#sortSeg button').forEach(x=>x.classList.toggle('active',x===b));render();});
document.getElementById('studyBtn').addEventListener('click',e=>{
  st.study=!st.study;e.currentTarget.classList.toggle('active',st.study);render();});
document.getElementById('out').addEventListener('click',e=>{
  const h=e.target.closest('.hide');
  if(st.study&&h){h.classList.toggle('rev');return;}          // en modo estudio, tocar revela
  if(e.target.closest('a'))return;
  const top=e.target.closest('.k-top');
  if(top){const row=top.parentElement,c=row.dataset.c;
    row.classList.toggle('open');row.classList.contains('open')?st.open.add(c):st.open.delete(c);}
});

renderChips();render();
</script>
