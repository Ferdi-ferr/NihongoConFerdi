<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kana Builder — Nihongo L1-L3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f5f5f0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem}
#app{width:100%;max-width:560px}
h1{font-size:15px;font-weight:600;color:#555;margin-bottom:1.2rem;text-align:center;letter-spacing:.03em}

.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;flex-wrap:wrap;gap:8px}
.lesson-filters{display:flex;gap:6px}
.lbtn{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid #ccc;background:#fff;color:#888;cursor:pointer;transition:all .15s}
.lbtn.active{background:#3b72d4;color:#fff;border-color:transparent}
.shuffle-btn{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid #ccc;background:#fff;color:#555;cursor:pointer}

.prog-bar-wrap{height:3px;background:#ddd;border-radius:2px;margin-bottom:.6rem;overflow:hidden}
.prog-bar-fill{height:100%;background:#3b72d4;border-radius:2px;transition:width .3s}
.progress-text{font-size:12px;color:#aaa;text-align:center;margin-bottom:1rem}

.card{background:#fff;border:1px solid #e0e0d8;border-radius:16px;padding:1.5rem 1.25rem;margin-bottom:.9rem}
.card-meta{font-size:11px;font-weight:600;color:#bbb;letter-spacing:.07em;text-transform:uppercase;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}
.card-status{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.card-status.ok{background:#e8f5ec;color:#2d7a3e}
.card-status.err{background:#fdecea;color:#b03030}
.card-status.revealed{background:#fdf6e3;color:#8a6800}

.word-es{font-size:26px;font-weight:500;color:#222;margin-bottom:1.1rem}

.answer-row{display:flex;align-items:center;gap:10px;margin-bottom:.9rem;min-height:52px;flex-wrap:wrap}
.answer-slots{display:flex;gap:6px;flex-wrap:wrap;flex:1}

.slot{
  min-width:40px;height:44px;border-radius:10px;
  border:2px solid #d0d0c8;background:#fafaf7;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#222;padding:0 6px;
  transition:border-color .15s,background .15s;
  cursor:default;
}
.slot.filled{border-color:#3b72d4;background:#eef3fd;cursor:pointer}
.slot.filled:hover{border-color:#2255bb;background:#dce8fb}
.word-rom{font-size:14px;color:#aaa;margin-top:-0.6rem;margin-bottom:1rem;min-height:20px}
.slot.state-ok{border-color:#2d7a3e !important;background:#e8f5ec !important}
.slot.state-err{border-color:#c03030 !important;background:#fdecea !important}
.slot.state-revealed{border-color:#c8a800 !important;background:#fffbe6 !important}
.slot.anim-pop{animation:pop .22s ease}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.1)}100%{transform:scale(1)}}

/* full-row shake on wrong verify */
.answer-slots.shake{animation:rowshake .35s ease}
@keyframes rowshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}

.btn-del{
  width:40px;height:44px;border-radius:10px;
  border:1px solid #ddd;background:#f7f7f4;color:#888;
  font-size:18px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.btn-del:hover:not(:disabled){background:#ececea}
.btn-del:disabled{opacity:.3;cursor:default}

.kana-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem}
.kbtn{
  min-width:46px;height:46px;border-radius:10px;
  border:1px solid #d8d8d0;background:#fff;
  font-size:20px;color:#222;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:0 6px;
  transition:transform .1s,background .15s,opacity .15s;
  user-select:none;
}
.kbtn:hover:not(:disabled){background:#f0f0eb;border-color:#bbb}
.kbtn:active:not(:disabled){transform:scale(.91)}
.kbtn:disabled{opacity:.22;cursor:default}

.feedback{min-height:26px;font-size:13px;font-weight:500;text-align:center;margin-bottom:.6rem}
.feedback.ok{color:#2d7a3e}
.feedback.err{color:#b03030}
.feedback.hint{color:#aaa}
.feedback.warn{color:#8a6800}

/* inline action row — verify / retry / reveal */
.action-row{display:flex;gap:8px;justify-content:center;margin-bottom:.6rem;flex-wrap:wrap}
.abtn{
  font-size:13px;padding:8px 18px;border-radius:10px;
  border:1px solid #ddd;background:#f7f7f4;color:#333;
  cursor:pointer;font-weight:500;transition:all .15s;
}
.abtn:hover{background:#ececea}
.abtn.verify{background:#3b72d4;color:#fff;border-color:transparent}
.abtn.verify:hover{background:#2f5eab}
.abtn.retry{background:#fdecea;color:#b03030;border-color:transparent}
.abtn.retry:hover{background:#f9d6d4}
.abtn.reveal{background:#fdf6e3;color:#8a6800;border-color:transparent;font-size:12px}
.abtn.reveal:hover{background:#faefc5}

/* nav */
.nav-controls{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:.75rem}
.nav-btn{
  font-size:13px;padding:9px 20px;border-radius:10px;
  border:1px solid #ddd;background:#f7f7f4;color:#333;
  cursor:pointer;transition:all .15s;font-weight:500;
}
.nav-btn:hover:not(:disabled){background:#ececea}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn.primary{background:#3b72d4;color:#fff;border-color:transparent}
.nav-btn.primary:hover:not(:disabled){background:#2f5eab}

.stats-bar{display:flex;gap:8px;justify-content:center;font-size:12px;flex-wrap:wrap;margin-bottom:1rem}
.stat{padding:3px 10px;border-radius:99px;background:#f0f0eb;color:#aaa}
.stat.s-ok{color:#2d7a3e}
.stat.s-err{color:#b03030}

.done-msg{background:#fff;border:1px solid #e0e0d8;border-radius:16px;padding:2.5rem 1.5rem;text-align:center}
.done-msg h2{font-size:20px;font-weight:600;margin-bottom:8px;color:#222}
.done-msg p{font-size:14px;color:#777;margin-bottom:1.5rem}
.done-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ── TORII HOME BUTTON ── */
.torii-home{
  position:fixed;top:14px;left:14px;z-index:999;
  text-decoration:none;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  opacity:.85;transition:opacity .2s,transform .2s;
}
.torii-home:hover{opacity:1;transform:scale(1.08);}
.torii-label{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:#c0392b;font-family:sans-serif;font-weight:600;
}

}
</style>

<div id="app">

  <div class="top-bar">
    <div class="lesson-filters">
      <button class="lbtn active" onclick="toggleLesson(1,this)">L1</button>

      <button class="lbtn active" onclick="toggleLesson(3,this)">L3</button>

    <button class="shuffle-btn" onclick="buildDeck()">⇄ Barajar</button>
  </div>

  <div class="prog-bar-wrap"><div class="prog-bar-fill" id="progBar" style="width:0%"></div></div>
  <div class="progress-text" id="progressText"></div>

  <div class="card" id="mainCard">

      <span id="cardLesson"></span>
      <span id="cardStatus" class="card-status"></span>
    </div>
    <div class="word-es" id="wordEs"></div>
    <div class="word-rom" id="wordRom"></div>

    <div class="answer-row">
      <div class="answer-slots" id="answerSlots"></div>
      <button class="btn-del" id="btnDel" onclick="deleteLast()" title="Borrar último">←</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="action-row" id="actionRow"></div>
    <div class="kana-grid" id="kanaGrid"></div>
  </div>

  <div class="nav-controls">
    <button class="nav-btn" id="btnPrev" onclick="goTo(idx-1)" disabled>← Anterior</button>
    <button class="nav-btn primary" id="btnNext" onclick="goNext()">Siguiente →</button>
  </div>

  <div class="stats-bar">
    <span class="stat" id="statTotal"></span>
    <span class="stat s-ok" id="statOk"></span>
    <span class="stat s-err" id="statErr"></span>
    <span class="stat" id="statBlank"></span>
  </div>

  <div id="doneMsg" class="done-msg" style="display:none">
    <h2>¡Ronda completa! 🎉</h2>
    <p id="doneSummary"></p>
    <div class="done-btns">
      <button class="nav-btn" onclick="buildDeck()">Repetir todo</button>
      <button class="nav-btn" onclick="reviewAll()">← Repasar mis respuestas</button>
    </div>
  </div>
</div>

  {es:"pasado mañana",                   tokens:["あ","さっ","て"],                                 rom:"asatte",           l:4},
  {es:"esta mañana",                     tokens:["け","さ"],                                        rom:"kesa",             l:4},
  {es:"esta noche",                      tokens:["こ","ん","ば","ん"],                              rom:"konban",           l:4},
  {es:"día libre / festivo",             tokens:["や","す","み"],                                   rom:"yasumi",           l:4},
  {es:"hora del almuerzo",               tokens:["ひ","る","や","す","み"],                         rom:"hiruyasumi",       l:4},
  {es:"examen",                          tokens:["し","け","ん"],                                   rom:"shiken",           l:4},
  {es:"reunión / conferencia",           tokens:["か","い","ぎ"],                                   rom:"kaigi",            l:4},
  {es:"película",                        tokens:["え","い","が"],                                   rom:"eiga",             l:4},
  {es:"todas las mañanas",               tokens:["ま","い","あ","さ"],                              rom:"maiasa",           l:4},
  {es:"todas las noches",                tokens:["ま","い","ば","ん"],                              rom:"maiban",           l:4},
  {es:"todos los días",                  tokens:["ま","い","に","ち"],                              rom:"mainichi",         l:4},
  {es:"lunes",                           tokens:["げ","つ","よう","び"],                            rom:"getsuyoubi",       l:4},
  {es:"martes",                          tokens:["か","よう","び"],                                 rom:"kayoubi",          l:4},
  {es:"miércoles",                       tokens:["す","い","よう","び"],                            rom:"suiyoubi",         l:4},
  {es:"jueves",                          tokens:["も","く","よう","び"],                            rom:"mokuyoubi",        l:4},
  {es:"viernes",                         tokens:["き","ん","よう","び"],                            rom:"kinyoubi",         l:4},
  {es:"sábado",                          tokens:["ど","よう","び"],                                 rom:"doyoubi",          l:4},
  {es:"domingo",                         tokens:["に","ち","よう","び"],                            rom:"nichiyoubi",       l:4},
  {es:"¿qué día?",                       tokens:["な","ん","よう","び"],                            rom:"nanyoubi",         l:4},
  {es:"número",                          tokens:["ば","ん","ごう"],                                 rom:"bangou",           l:4},
  {es:"¿qué número?",                    tokens:["な","ん","ば","ん"],                              rom:"nanban",           l:4},
  {es:"Nueva York",                      tokens:["ニュー","ヨー","ク"],                             rom:"nyuuyooku",        l:4},
  {es:"Pekín",                           tokens:["ペ","キ","ン"],                                   rom:"pekin",            l:4},
  {es:"Los Ángeles",                     tokens:["ロ","サ","ン","ゼ","ル","ス"],                    rom:"rosanzerusu",      l:4},
  {es:"Londres",                         tokens:["ロ","ン","ド","ン"],                              rom:"rondon",           l:4},
];

const HIRA_POOL=["あ","い","う","え","お","か","き","く","け","こ","さ","し","す","せ","そ","た","ち","つ","て","と","な","に","ぬ","ね","の","は","ひ","ふ","へ","ほ","ま","み","む","め","も","や","ゆ","よ","ら","り","る","れ","ろ","わ","を","ん","が","ぎ","ぐ","げ","ご","ざ","じ","ず","ぜ","ぞ","だ","で","ど","ば","び","ぶ","べ","ぼ","きゃ","きょ","しゃ","しょ","ちゃ","ちょ","にゃ","にょ","ひゃ","ひょ","みゃ","みょ","りゃ","りょ","ぎゃ","ぎょ","じゃ","じょ","びゃ","びょ"];
const KATA_POOL=["ア","イ","ウ","エ","オ","カ","キ","ク","ケ","コ","サ","シ","ス","セ","ソ","タ","チ","ツ","テ","ト","ナ","ニ","ヌ","ネ","ノ","ハ","ヒ","フ","ヘ","ホ","マ","ミ","ム","メ","モ","ヤ","ユ","ヨ","ラ","リ","ル","レ","ロ","ワ","ヲ","ン","ガ","ギ","グ","ゲ","ゴ","ザ","ジ","ズ","ゼ","ゾ","ダ","デ","ド","バ","ビ","ブ","ベ","ボ","ー","ッ","シャ","ショ","チャ","チョ","ジャ","ジョ"];

// card state phases:
// 'input'    — student is filling slots freely
// 'wrong'    — verified and incorrect (can retry or move on)
// 'correct'  — verified and correct
// 'revealed' — answer was shown

let deck=[], idx=0, activeLessons=new Set([1,2,3,4]);
let cardStates=[];   // per-card: { phase, answer, buttons, hadError }

const TARGET=18;

// Hiragana equivalents for katakana decoys (same sound, different script)
// Only a handful per sound — enough to deceive without flooding
const KATA_TO_HIRA_DECOYS={
  "ア":"あ","イ":"い","ウ":"う","エ":"え","オ":"お",
  "カ":"か","キ":"き","ク":"く","ケ":"け","コ":"こ",
  "サ":"さ","シ":"し","ス":"す","セ":"せ","ソ":"そ",
  "タ":"た","チ":"ち","ツ":"つ","テ":"て","ト":"と",
  "ナ":"な","ニ":"に","ヌ":"ぬ","ネ":"ね","ノ":"の",
  "ハ":"は","ヒ":"ひ","フ":"ふ","ヘ":"へ","ホ":"ほ",
  "マ":"ま","ミ":"み","ム":"む","メ":"め","モ":"も",
  "ヤ":"や","ユ":"ゆ","ヨ":"よ",
  "ラ":"ら","リ":"り","ル":"る","レ":"れ","ロ":"ろ",
  "ワ":"わ","ン":"ん",
  "ガ":"が","ギ":"ぎ","グ":"ぐ","ゲ":"げ","ゴ":"ご",
  "ザ":"ざ","ジ":"じ","ズ":"ず","ゼ":"ぜ","ゾ":"ぞ",
  "ダ":"だ","デ":"で","ド":"ど",
  "バ":"ば","ビ":"び","ブ":"ぶ","ベ":"べ","ボ":"ぼ",
  "シャ":"しゃ","ショ":"しょ","チャ":"ちゃ","チョ":"ちょ","ジャ":"じゃ","ジョ":"じょ",
};

function isKata(s){return /^[\u30A0-\u30FF]+$/.test(s);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

function makeButtons(tokens){
  const hasKata=tokens.some(t=>isKata(t));
  const needed=new Set(tokens); // unique tokens needed
  const allNeeded=[...tokens];  // with duplicates, for the actual answer slots
  const buttonSet=new Set(allNeeded);
  const fillerPool=(hasKata?KATA_POOL:HIRA_POOL).filter(k=>!buttonSet.has(k));
  shuffle(fillerPool);

  const fillers=[];
  let hiraDecoysAdded=0;
  const maxHiraDecoys=hasKata ? 3 : 0; // up to 3 hiragana decoys for katakana words

  for(const f of fillerPool){
    if(fillers.length>= TARGET - allNeeded.length) break;
    fillers.push(f);
    // after adding a katakana filler, maybe add its hiragana twin as a decoy
    if(hasKata && hiraDecoysAdded < maxHiraDecoys && KATA_TO_HIRA_DECOYS[f]){
      const hd=KATA_TO_HIRA_DECOYS[f];
      if(!buttonSet.has(hd)){
        fillers.push(hd);
        buttonSet.add(hd);
        hiraDecoysAdded++;
      }
    }
    if(fillers.length >= TARGET - allNeeded.length) break;
  }

  const all=[...allNeeded,...fillers.slice(0, TARGET - allNeeded.length)];
  shuffle(all);
  return all;
}

function initState(i){
  if(!cardStates[i]){
    cardStates[i]={
      phase:'input',   // input | wrong | correct | revealed
      answer:[],
      buttons:makeButtons(deck[i].tokens),
      hadError:false
    };
  }
}

// ── BUILD ─────────────────────────────────────────────────────────
function buildDeck(){
  deck=ALL.filter(c=>activeLessons.has(c.l));
  shuffle(deck);
  cardStates=new Array(deck.length).fill(null);
  idx=0;
  document.getElementById('doneMsg').style.display='none';
  document.getElementById('mainCard').style.display='block';
  document.querySelector('.nav-controls').style.display='flex';
  render(); updateStats();
}

function toggleLesson(n,btn){
  if(activeLessons.has(n)){if(activeLessons.size===1)return;activeLessons.delete(n);btn.classList.remove('active');}
  else{activeLessons.add(n);btn.classList.add('active');}
  buildDeck();
}

// ── NAVIGATION ────────────────────────────────────────────────────
function goTo(i){
  if(i<0||i>=deck.length)return;
  idx=i;
  document.getElementById('doneMsg').style.display='none';
  document.getElementById('mainCard').style.display='block';
  document.querySelector('.nav-controls').style.display='flex';
  render();
}

function goNext(){
  if(idx===deck.length-1){ showDone(); return; }
  idx++; render();
}

// ── RENDER ────────────────────────────────────────────────────────
function render(){
  initState(idx);
  const card=deck[idx], st=cardStates[idx];

  document.getElementById('cardLesson').textContent='Lección '+card.l;
  document.getElementById('wordEs').textContent=card.es;
  // romaji: only shown after correct answer or reveal
  const romEl=document.getElementById('wordRom');
  if(st.phase==='correct'||st.phase==='revealed'){
    romEl.textContent='('+card.rom+')';
  } else {
    romEl.textContent='';
  }

  // progress bar
  const pct=Math.round((idx/(deck.length-1||1))*100);
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progressText').textContent=(idx+1)+' / '+deck.length;

  // badge
  const badge=document.getElementById('cardStatus');
  const phaseLabel={input:'',wrong:'✗ Incorrecto',correct:'✓ Correcta',revealed:'👁 Revelada'};
  const phaseClass={input:'',wrong:'err',correct:'ok',revealed:'revealed'};
  badge.textContent=phaseLabel[st.phase];
  badge.className='card-status'+(phaseClass[st.phase]?' '+phaseClass[st.phase]:'');

  renderSlots();
  setFeedback('','hint'); // clear before renderActions sets it
  renderActions();
  renderButtons();

  // nav
  document.getElementById('btnPrev').disabled=(idx===0);
  const nextBtn=document.getElementById('btnNext');
  const done=st.phase!=='input';
  nextBtn.disabled=!done;
  nextBtn.className='nav-btn'+(done?' primary':'');
  nextBtn.textContent=(idx===deck.length-1&&done)?'Ver resultados →':'Siguiente →';

  // delete btn
  document.getElementById('btnDel').disabled=(st.answer.length===0||st.phase!=='input');
}

function renderSlots(){
  const container=document.getElementById('answerSlots');
  container.innerHTML='';
  const card=deck[idx], st=cardStates[idx];
  const locked=st.phase!=='input';
  for(let i=0;i<card.tokens.length;i++){
    const div=document.createElement('div');
    div.className='slot';
    div.id='slot-'+i;
    if(st.answer[i]!==undefined){
      div.textContent=st.answer[i];
      if(st.phase==='input'){
        div.classList.add('filled');
        // clicking a filled slot returns that kana to the grid
        div.onclick=()=>removeSlotAt(i);
      } else if(st.phase==='correct') div.classList.add('state-ok');
      else if(st.phase==='wrong') div.classList.add('state-err');
      else if(st.phase==='revealed') div.classList.add('state-revealed');
    }
    container.appendChild(div);
  }
}

function renderActions(){
  const row=document.getElementById('actionRow');
  row.innerHTML='';
  const st=cardStates[idx];

  if(st.phase==='input'){
    // no verify button — auto-verified when last slot filled
    const r=document.createElement('button');
    r.className='abtn reveal'; r.textContent='👁 Ver respuesta';
    r.onclick=revealAnswer; row.appendChild(r);
  } else if(st.phase==='wrong'){
    setFeedback('Incorrecto — ¿quieres intentarlo de nuevo?','err');
    const retry=document.createElement('button');
    retry.className='abtn retry'; retry.textContent='↺ Reintentar';
    retry.onclick=retryCard; row.appendChild(retry);
  } else if(st.phase==='correct'){
    setFeedback(st.hadError?'¡Correcto! (con reintento)':'¡Perfecto! ✓','ok');
  } else if(st.phase==='revealed'){
    setFeedback('Respuesta revelada','warn');
  }
}

function renderButtons(){
  const grid=document.getElementById('kanaGrid');
  grid.innerHTML='';
  const st=cardStates[idx];
  const locked=st.phase!=='input';
  const usedIdx=getUsed(st.answer,st.buttons);
  st.buttons.forEach((k,i)=>{
    const btn=document.createElement('button');
    btn.id='kbtn-'+i; btn.className='kbtn'; btn.textContent=k;
    btn.disabled=locked||usedIdx.has(i);
    btn.onclick=locked?null:()=>handleKana(k,i);
    grid.appendChild(btn);
  });
}

function getUsed(answer,buttons){
  const used=new Set();
  for(const t of answer){
    for(let i=0;i<buttons.length;i++){
      if(buttons[i]===t&&!used.has(i)){used.add(i);break;}
    }
  }
  return used;
}

// ── INTERACTION ───────────────────────────────────────────────────
function handleKana(k,btnIdx){
  const st=cardStates[idx];
  if(st.phase!=='input') return;
  const tokens=deck[idx].tokens;
  // find the first empty slot
  const pos=st.answer.length;
  if(pos>=tokens.length) return;

  st.answer.push(k);
  document.getElementById('kbtn-'+btnIdx).disabled=true;

  // animate slot
  const slot=document.getElementById('slot-'+pos);
  slot.textContent=k;
  slot.classList.add('filled');
  slot.onclick=()=>removeSlotAt(pos);
  slot.classList.remove('anim-pop');
  void slot.offsetWidth;
  slot.classList.add('anim-pop');

  setFeedback('','hint');
  document.getElementById('btnDel').disabled=false;

  // auto-verify when last slot filled
  if(st.answer.length===tokens.length){
    setTimeout(verifyAnswer, 120);
  }
}

function verifyAnswer(){
  const st=cardStates[idx];
  const tokens=deck[idx].tokens;
  const correct=st.answer.every((k,i)=>k===tokens[i]);
  if(correct){
    st.phase='correct';
  } else {
    st.phase='wrong';
    st.hadError=true;
  }
  updateStats();
  render();
  if(!correct){
    // shake the row
    const row=document.getElementById('answerSlots');
    row.classList.remove('shake');
    void row.offsetWidth;
    row.classList.add('shake');
  }
}

function retryCard(){
  const st=cardStates[idx];
  // hadError stays true — the retry doesn't erase the mistake
  st.phase='input';
  st.answer=[];
  render();
  setFeedback('','hint');
}

function revealAnswer(){
  const st=cardStates[idx];
  st.answer=[...deck[idx].tokens];
  st.phase='revealed';
  updateStats();
  render();
}

// Remove a specific slot by index — re-enables its button and shifts answer left
function removeSlotAt(pos){
  const st=cardStates[idx];
  if(st.phase!=='input') return;
  const token=st.answer[pos];
  // re-enable the matching button
  const usedBefore=getUsed(st.answer.slice(0,pos),st.buttons);
  for(let i=0;i<st.buttons.length;i++){
    if(st.buttons[i]===token&&!usedBefore.has(i)){
      const b=document.getElementById('kbtn-'+i);
      if(b) b.disabled=false;
      break;
    }
  }
  st.answer.splice(pos,1);
  setFeedback('','hint');
  render();
}

function deleteLast(){
  const st=cardStates[idx];
  if(st.answer.length===0||st.phase!=='input') return;
  removeSlotAt(st.answer.length-1);
}

// ── STATS ─────────────────────────────────────────────────────────
function updateStats(){
  let ok=0,err=0,rev=0,blank=0;
  for(let i=0;i<deck.length;i++){
    const s=cardStates[i];
    if(!s||s.phase==='input') blank++;
    else if(s.phase==='correct'&&!s.hadError) ok++;
    else if(s.phase==='correct'&&s.hadError) err++;
    else if(s.phase==='wrong') err++;
    else if(s.phase==='revealed') rev++;
  }
  document.getElementById('statTotal').textContent='Total: '+deck.length;
  document.getElementById('statOk').textContent='✓ '+ok;
  document.getElementById('statErr').textContent='✗ '+(err+rev);
  document.getElementById('statBlank').textContent='— '+blank;
}

function setFeedback(msg,type){
  const el=document.getElementById('feedback');
  el.textContent=msg;
  el.className='feedback '+type;
}

function showDone(){
  document.getElementById('mainCard').style.display='none';
  document.querySelector('.nav-controls').style.display='none';
  document.getElementById('doneMsg').style.display='block';
  let ok=0,err=0,rev=0;
  for(const s of cardStates){
    if(!s||s.phase==='input') continue;
    if(s.phase==='correct'&&!s.hadError) ok++;
    else if(s.phase==='correct'&&s.hadError) err++;
    else if(s.phase==='wrong') err++;
    else if(s.phase==='revealed') rev++;
  }
  document.getElementById('doneSummary').textContent=
    '✓ '+ok+' perfectas · ✗ '+err+' con errores · 👁 '+rev+' reveladas.';
}

buildDeck();

function reviewAll(){
  idx=0;
  document.getElementById('doneMsg').style.display='none';
  document.getElementById('mainCard').style.display='block';
  document.querySelector('.nav-controls').style.display='flex';
  goTo(0);
}
</script>
